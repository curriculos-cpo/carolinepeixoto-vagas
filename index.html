  }catch(err){
    showToast('Vaga salva no painel, mas não foi possível atualizar a página pública agora.', true);
  }
}

async function importarInscricoes(){
  if(!appsScriptConfigurado()){ showToast('Integração com o Google ainda não foi configurada.', true); return; }
  showToast('Buscando novas inscrições…');
  try{
    const resp = await chamarAppsScriptGet('action=inscricoes');
    const inscricoes = resp.inscricoes || [];
    const idsExistentes = new Set(db.candidatos.map(c=>c.inscricaoId).filter(Boolean));
    let novos = 0;
    const cargosAfetados = new Set();

    inscricoes.forEach(row=>{
      if(!row.id || idsExistentes.has(row.id)) return;
      const cargo = getCargo(row.cargoId);
      if(!cargo) return;
      db.candidatos.push({
        id: uid('cand'), inscricaoId: row.id,
        clienteId: cargo.clienteId, cargoId: cargo.id,
        nome: row.nome || '', telefone: row.telefone || '', email: row.email || '',
        origem: 'Página pública (link)', dataRecebimento: (row.data ? String(row.data).slice(0,10) : todayISO()),
        etapas: defaultEtapas(), convidado:false, declinou:false, dataDeclinio:'', motivoDeclinio:'',
        statusManual:'', observacoes:'', temCurriculo:false, curriculoNome: row.curriculoNome||'', curriculoUrl: row.curriculoUrl||''
      });
      novos++;
      cargosAfetados.add(cargo.id);
    });

    cargosAfetados.forEach(cargoId=>{
      const cargo = getCargo(cargoId);
      if(!cargo) return;
      const totalRegistrados = candidatosDoCargo(cargoId).length;
      if(curriculosRecebidosCargo(cargo) < totalRegistrados){ cargo.curriculosRecebidos = totalRegistrados; }
    });

    if(novos > 0){ saveDB(); renderView(); }
    showToast(novos > 0 ? novos + ' nova(s) inscrição(ões) importada(s).' : 'Nenhuma inscrição nova encontrada.');
  }catch(err){
    showToast(err.message || 'Não foi possível buscar as inscrições agora.', true);
  }
}

  });
  document.getElementById('sel-status-pagamento').addEventListener('change', e=>{
    document.getElementById('campo-valor-pago').style.display = e.target.value === 'parcial' ? 'flex' : 'none';
    document.getElementById('campo-data-pagamento').style.display = e.target.value !== 'pendente' ? 'flex' : 'none';
    const dInput = document.querySelector('#campo-data-pagamento input');
    if(e.target.value !== 'pendente' && dInput && !dInput.value){ dInput.value = todayISO(); }
  });
  document.getElementById('form-vaga').addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    let curriculosRecebidos = parseInt(f.get('curriculosRecebidos')||'0',10) || 0;
    const jaRegistrados = editando ? candidatosDoCargo(vaga.id).length : 0;
    if(curriculosRecebidos < jaRegistrados){
      curriculosRecebidos = jaRegistrados;
      showToast('A quantidade de currículos recebidos não pode ser menor que os candidatos já cadastrados nesta vaga ('+jaRegistrados+'). Ajustada automaticamente.', true);
    }
    const dados = {
      clienteId: f.get('clienteId'),
      titulo: f.get('titulo').trim(),
      quantidadeVagas: parseInt(f.get('quantidadeVagas')||'1',10) || 1,
      curriculosRecebidos: curriculosRecebidos,
      responsavel: f.get('responsavel').trim(),
      dataAbertura: f.get('dataAbertura'),
      dataFechamentoPrevista: f.get('dataFechamentoPrevista'),
      status: f.get('status') || 'aberta',
      houveContratacao: f.get('status')==='fechada' ? (f.get('houveContratacao')||'') : '',
      dataFechamentoReal: f.get('status')==='fechada' ? (f.get('dataFechamentoReal')||'') : '',
      observacoes: f.get('observacoes').trim(),
      vagaPublicaAtiva: !!f.get('vagaPublicaAtiva'),
      exibirNomeCliente: !!f.get('exibirNomeCliente'),
      modalidade: f.get('modalidade') || '',
      localTrabalho: f.get('localTrabalho').trim(),
      descricaoPublica: f.get('descricaoPublica').trim(),
      salario: f.get('salario').trim(),
      oQueVaiFazer: f.get('oQueVaiFazer').trim(),
      oQueBuscamos: f.get('oQueBuscamos').trim(),
      beneficios: Object.fromEntries(BENEFICIOS_LISTA.map(b => [b.chave, !!f.get('beneficio_'+b.chave)])),
      beneficiosOutros: f.get('beneficiosOutros').trim()
    };

    const valorServicoNum = f.get('valorServico') !== '' ? (parseFloat(f.get('valorServico')) || 0) : '';
    let statusPagamento = f.get('statusPagamento') || 'pendente';
    let valorPago = 0;
    let dataPagamento = f.get('dataPagamento') || '';
    if(statusPagamento === 'pago'){
      valorPago = (valorServicoNum === '' ? 0 : valorServicoNum);
    } else if(statusPagamento === 'parcial'){
      valorPago = parseFloat(f.get('valorPago')) || 0;
      if(valorServicoNum !== '' && valorPago >= valorServicoNum){
        valorPago = valorServicoNum; statusPagamento = 'pago';
      }
    } else {
      valorPago = 0; dataPagamento = '';
    }
    dados.valorServico = valorServicoNum;
    dados.statusPagamento = statusPagamento;
    dados.valorPago = valorPago;
    dados.dataPagamento = dataPagamento;
    dados.observacoesFinanceiras = f.get('observacoesFinanceiras').trim();

    let cargoSalvo;
    if(editando){ Object.assign(vaga, dados); cargoSalvo = vaga; }
    else { cargoSalvo = Object.assign({id:uid('vg'), status:'aberta', dataFechamentoReal:''}, dados); db.cargos.push(cargoSalvo); }
    closeModal(); saveDB();
    state.viewClienteId = dados.clienteId;
    renderView();
    if(dados.vagaPublicaAtiva){ showToast('Página pública ativada. Use o botão "Link de inscrição" na linha da vaga para compartilhar.'); }
    if(dados.vagaPublicaAtiva || eraPublicaAntes){ sincronizarVagaPublica(cargoSalvo); }
  });
}

      <div class="form-grid" id="banco-anotacoes-wrap" style="display:${candidato.bancoDeCurriculos?'grid':'none'};margin-top:8px;">

          <label>Área/cargo de interesse</label>
          <input name="areaInteresse" value="${esc(candidato.areaInteresse||'')}" placeholder="Ex.: Vendas, Administrativo, Cozinha…">

        <div class="field"><label>Status geral</label>

            <option value="em_processo" ${candidato.statusManual==='em_processo'?'selected':''}>Forçar: Em processo</option>
            <option value="contratado" ${candidato.statusManual==='contratado'?'selected':''}>Forçar: Contratado</option>
            <option value="nao_avancou" ${candidato.statusManual==='nao_avancou'?'selected':''}>Forçar: Não avançou</option>
            <option value="declinou" ${candidato.statusManual==='declinou'?'selected':''}>Forçar: Declinou</option>
          </select>
          <div class="hint">Deixe em "Automático" para o sistema calcular a partir das etapas.</div>

        <span>${editando ? '<span class="btn btn-danger btn-sm" data-action=\"excluir-candidato\" data-id=\"'+candidato.id+'\">Excluir candidato</span>' : ''}</span>

          <span class="btn btn-secondary" data-action="fechar-modal">Cancelar</span>

  function popularCargos(){
    const clienteId = document.getElementById('sel-cliente').value;
    const selCargo = document.getElementById('sel-cargo');
    if(!clienteId){ selCargo.innerHTML = '<option value="">Nenhum</option>'; return; }
    const opts = cargosDoCliente(clienteId);
    selCargo.innerHTML = '<option value="">Nenhum</option>' + opts.map(v=>'<option value="'+v.id+'" '+(candidato.cargoId===v.id?'selected':'')+'>'+esc(v.titulo)+'</option>').join('');
  }
  document.getElementById('sel-cliente').addEventListener('change', popularCargos);
  popularCargos();

  document.getElementById('chk-banco').addEventListener('change', e=>{
    document.getElementById('banco-anotacoes-wrap').style.display = e.target.checked ? 'grid' : 'none';
  });

  document.getElementById('etapas-body').addEventListener('change', e=>{
    const t = e.target;
    const idx = t.dataset.etapaIdx;
    if(idx===undefined) return;
    const field = t.dataset.field;
    candidato.etapas[idx][field] = t.value;
    if(field==='resultado' && (t.value==='avancou'||t.value==='nao_avancou')){
      const dataInput = document.querySelector('input[data-etapa-idx="'+idx+'"][data-field="data"]');
      if(dataInput && !dataInput.value){ dataInput.value = todayISO(); candidato.etapas[idx].data = todayISO(); }
    }
  });

  document.getElementById('chk-declinou').addEventListener('change', e=>{
    document.getElementById('declinio-detalhes').style.display = e.target.checked ? 'grid' : 'none';
    if(e.target.checked){
      const dInput = document.querySelector('#declinio-detalhes input[name="dataDeclinio"]');
      if(dInput && !dInput.value) dInput.value = todayISO();
    }
  });

  const inputCurriculo = document.getElementById('input-curriculo');
  const areaLeitura = document.getElementById('area-leitura-curriculo');
  if(inputCurriculo){
    inputCurriculo.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(file && file.size > TAMANHO_MAX_CURRICULO){
        showToast('Arquivo muito grande (máximo de 4MB).', true);
        e.target.value = '';
        arquivoCurriculoSelecionado = null;
        if(areaLeitura) areaLeitura.innerHTML = '';
        return;
      }
      arquivoCurriculoSelecionado = file || null;
      if(file && areaLeitura){
        areaLeitura.innerHTML = '<span class="btn btn-secondary btn-sm" id="btn-ler-curriculo" type="button">🔎 Ler currículo e preencher nome/e-mail/telefone</span>';
        document.getElementById('btn-ler-curriculo').addEventListener('click', async ()=>{
          const btn = document.getElementById('btn-ler-curriculo');
          btn.textContent = 'Lendo currículo…';
          try{
            const texto = await extrairTextoArquivo(arquivoCurriculoSelecionado);
            const dados = extrairContatosDoTexto(texto);
            let preenchidos = [];
            if(dados.nome){ const campo = document.querySelector('#form-candidato [name="nome"]'); if(campo && !campo.value){ campo.value = dados.nome; preenchidos.push('nome'); } }
            if(dados.email){ const campo = document.querySelector('#form-candidato [name="email"]'); if(campo && !campo.value){ campo.value = dados.email; preenchidos.push('e-mail'); } }
            if(dados.telefone){ const campo = document.querySelector('#form-candidato [name="telefone"]'); if(campo && !campo.value){ campo.value = dados.telefone; preenchidos.push('telefone'); } }
            showToast(preenchidos.length ? 'Preenchido automaticamente: '+preenchidos.join(', ')+'. Confira antes de salvar.' : 'Não consegui identificar os dados automaticamente. Preencha manualmente.', preenchidos.length===0);
            btn.textContent = '🔎 Ler currículo e preencher nome/e-mail/telefone';
          }catch(err){
            showToast(err.message || 'Não foi possível ler este arquivo automaticamente.', true);
            btn.textContent = '🔎 Ler currículo e preencher nome/e-mail/telefone';
          }
        });
      } else if(areaLeitura){
        areaLeitura.innerHTML = '';
      }
    });
  }

  document.getElementById('form-candidato').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const cargoId = f.get('cargoId') || '';
    const clienteId = f.get('clienteId') || '';
    const bancoMarcado = !!f.get('bancoDeCurriculos');
    if(!cargoId && !bancoMarcado){
      showToast('Selecione uma vaga ou marque "Adicionar ao banco de currículos".', true);
      return;
    }
    const candidatoId = editando ? candidato.id : uid('cand');
    const dados = {
      clienteId: clienteId,
      cargoId: cargoId,
      nome: f.get('nome').trim(),
      telefone: f.get('telefone').trim(),
      email: f.get('email').trim(),
      origem: f.get('origem'),
      dataRecebimento: f.get('dataRecebimento') || todayISO(),
      etapas: candidato.etapas,
      convidado: !!f.get('convidado'),
      declinou: !!f.get('declinou'),
      dataDeclinio: f.get('dataDeclinio') || '',
      motivoDeclinio: f.get('motivoDeclinio').trim(),
      statusManual: f.get('statusManual') || '',
      observacoes: f.get('observacoes').trim(),
      temCurriculo: candidato.temCurriculo || false,
      curriculoNome: candidato.curriculoNome || '',
      curriculoUrl: candidato.curriculoUrl || '',
      inscricaoId: candidato.inscricaoId || '',
      bancoDeCurriculos: bancoMarcado,
      bancoAnotacoes: f.get('bancoAnotacoes').trim(),
      areaInteresse: f.get('areaInteresse').trim(),
      avaliacaoComportamental: candidato.avaliacaoComportamental || null
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Salvando…'; }

    try{
      if(arquivoCurriculoSelecionado){
        const salvo = await salvarCurriculo(candidatoId, arquivoCurriculoSelecionado);
        dados.temCurriculo = true; dados.curriculoNome = salvo.filename; dados.curriculoUrl = salvo.url || '';
      } else if(!!f.get('removerCurriculo')){
        await removerCurriculoStorage(candidatoId);
        dados.temCurriculo = false; dados.curriculoNome = ''; dados.curriculoUrl = '';
      }
    }catch(err){
      showToast(err.message || 'Erro ao processar o currículo.', true);
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Salvar candidato'; }
      return;
    }

    if(editando){
      const idxReal = db.candidatos.findIndex(c=>c.id===candidato.id);
      db.candidatos[idxReal] = Object.assign({id:candidatoId}, dados);
    } else {
      db.candidatos.push(Object.assign({id:candidatoId}, dados));
    }
    if(cargoId){
      const cargoAtualizado = getCargo(cargoId);
      if(cargoAtualizado){
        const totalRegistrados = candidatosDoCargo(cargoId).length;
        if(curriculosRecebidosCargo(cargoAtualizado) < totalRegistrados){
          cargoAtualizado.curriculosRecebidos = totalRegistrados;
        }
      }
    }
    const candidatoFinal = Object.assign({id:candidatoId}, dados);
    const statusNovo = statusCandidato(candidatoFinal);
    const mudouParaDesfecho = statusOriginal !== statusNovo && (statusNovo === 'contratado' || statusNovo === 'nao_avancou');
    closeModal(); saveDB(); renderView();
    if(mudouParaDesfecho){ modalMensagemAutomatica(candidatoFinal, statusNovo); }
  });
}

/* ============================= AÇÕES GLOBAIS ============================= */
function onGlobalClick(e){
  const resultadosBusca = document.getElementById('busca-global-resultados');
  if(resultadosBusca && !e.target.closest('.global-search-wrap')){ resultadosBusca.classList.remove('aberto'); }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  if(action === 'ir-busca'){ irParaResultadoBusca(el.dataset.tipo, id); return; }
  if(action === 'nav'){ state.tab = el.dataset.tab; renderView(); return; }
  if(action === 'agenda-mes'){ state.agendaMes = mesAdjacente(state.agendaMes, parseInt(el.dataset.delta,10)); renderView(); return; }
  if(action === 'agenda-selecionar-dia'){ state.agendaDiaSelecionado = el.dataset.data; renderView(); return; }
  if(action === 'agenda-novo'){ modalEventoAgenda(null, el.dataset.data || state.agendaDiaSelecionado); return; }
  if(action === 'abrir-ata'){ modalAta(id); return; }
  if(action === 'ata-copiar'){
    const campo = document.getElementById('ata-texto');
    if(!campo) return;
    const finalizar = ()=> showToast('Texto da ata copiado!');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(campo.value).then(finalizar).catch(()=>{ campo.select(); document.execCommand('copy'); finalizar(); });
    } else { campo.select(); document.execCommand('copy'); finalizar(); }
    return;
  }
  if(action === 'agenda-editar'){ modalEventoAgenda(db.agenda.find(e=>e.id===id)); return; }
  if(action === 'agenda-concluir'){
    const ev = db.agenda.find(e=>e.id===id);
    if(ev){ ev.concluido = !ev.concluido; saveDB(); renderView(); }
    return;
  }
  if(action === 'agenda-excluir'){
    if(confirm('Excluir este compromisso?')){
      db.agenda = db.agenda.filter(e=>e.id!==id);
      closeModal(); saveDB(); renderView();
    }
    return;
  }
  if(action === 'colab-aba'){ state.colabAba = el.dataset.aba; renderView(); return; }
  if(action === 'novo-absenteismo'){ modalAbsenteismo(null, el.dataset.clienteId); return; }
  if(action === 'editar-absenteismo'){ modalAbsenteismo(db.absenteismo.find(a=>a.id===id)); return; }
  if(action === 'excluir-absenteismo'){
    if(confirm('Excluir este registro? Esta ação não pode ser desfeita.')){
      db.absenteismo = db.absenteismo.filter(a=>a.id!==id);
      closeModal(); saveDB(); renderView();
    }
    return;
  }
  if(action === 'novo-colaborador'){ modalColaborador(null, el.dataset.clienteId); return; }
  if(action === 'editar-colaborador'){ modalColaborador(getColaborador(id)); return; }
  if(action === 'abrir-prontuario'){ abrirProntuario(id); return; }
  if(action === 'novo-registro-colaborador'){ modalNovoRegistro(id); return; }
  if(action === 'abrir-avaliacao-experiencia'){ modalAvaliacaoExperiencia(id, el.dataset.periodo); return; }
  if(action === 'excluir-colaborador'){
    if(confirm('Excluir este colaborador? Esta ação não pode ser desfeita.')){
      db.colaboradores = db.colaboradores.filter(c=>c.id!==id);
      closeModal(); saveDB(); renderView();
    }
    return;
  }
  if(action === 'nova-funcao'){ modalFuncao(null, el.dataset.clienteId); return; }
  if(action === 'editar-funcao'){ modalFuncao(getFuncao(id)); return; }
  if(action === 'excluir-funcao'){
    if(confirm('Excluir esta função? O descritivo de cargo vinculado também será removido. Colaboradores com essa função ficarão sem função definida.')){
      db.descritivosCargo = db.descritivosCargo.filter(d=>d.funcaoId!==id);
      db.colaboradores.forEach(c=>{ if(c.funcaoId===id) c.funcaoId=''; });
      db.funcoes = db.funcoes.filter(f=>f.id!==id);
      closeModal(); saveDB(); renderView();
    }
    return;
  }
  if(action === 'descritivo-cargo'){ modalDescritivoCargo(getFuncao(id)); return; }
  if(action === 'nova-mensalidade'){ modalMensalidade(null); return; }
  if(action === 'editar-mensalidade'){ modalMensalidade(db.mensalidadesBPO.find(m=>m.id===id)); return; }
  if(action === 'marcar-mensalidade-paga'){
    const m = db.mensalidadesBPO.find(x=>x.id===id);
    if(m){ m.statusPagamento='pago'; if(!m.dataPagamento) m.dataPagamento = todayISO(); saveDB(); renderView(); showToast('Mensalidade marcada como paga.'); }
    return;
  }
  if(action === 'excluir-mensalidade'){
    if(confirm('Excluir esta mensalidade? Esta ação não pode ser desfeita.')){
      db.mensalidadesBPO = db.mensalidadesBPO.filter(m=>m.id!==id);
      closeModal(); saveDB(); renderView();
    }
    return;
  }
  if(action === 'limpar-periodo-indicadores'){ state.indMesInicio=''; state.indMesFim=''; renderView(); return; }
  if(action === 'gerar-mensalidades-mes'){
    const mesAlvo = state.mensMes || mesAtualRef();
    const n = gerarMensalidadesDoMes(mesAlvo);
    state.mensMes = mesAlvo;
    saveDB(); renderView();
    showToast(n>0 ? n+' mensalidade(s) gerada(s) para '+formatMesRef(mesAlvo)+'.' : 'Todos os clientes BPO já tinham mensalidade gerada para '+formatMesRef(mesAlvo)+'.');
    return;
  }
  if(action === 'gerar-mensalidades-denuncia-mes'){
    const mesAlvo = state.denMensMes || mesAtualRef();
    const n = gerarMensalidadesCanalDenunciaDoMes(mesAlvo);
    state.denMensMes = mesAlvo;
    saveDB(); renderView();
    showToast(n>0 ? n+' mensalidade(s) gerada(s) para '+formatMesRef(mesAlvo)+'.' : 'Todos os clientes com canal ativo já tinham mensalidade gerada para '+formatMesRef(mesAlvo)+'.');
    return;
  }
  if(action === 'marcar-mensalidade-denuncia-paga'){
    const m = db.mensalidadesCanalDenuncia.find(x=>x.id===id);
    if(m){ m.statusPagamento='pago'; if(!m.dataPagamento) m.dataPagamento = todayISO(); saveDB(); renderView(); showToast('Mensalidade marcada como paga.'); }
    return;
  }
  if(action === 'excluir-mensalidade-denuncia'){
    if(confirm('Excluir esta mensalidade? Esta ação não pode ser desfeita.')){
      db.mensalidadesCanalDenuncia = db.mensalidadesCanalDenuncia.filter(m=>m.id!==id);
      saveDB(); renderView();
    }
    return;
  }
  if(action === 'novo-servico-avulso'){ modalServicoAvulso(null); return; }
  if(action === 'editar-servico-avulso'){ modalServicoAvulso(db.servicosAvulsos.find(s=>s.id===id)); return; }
  if(action === 'marcar-servico-avulso-pago'){
    const s = db.servicosAvulsos.find(x=>x.id===id);
    if(s){ s.statusPagamento='pago'; if(!s.dataPagamento) s.dataPagamento = todayISO(); saveDB(); renderView(); showToast('Serviço marcado como pago.'); }
    return;
  }
  if(action === 'excluir-servico-avulso'){
    if(confirm('Excluir este serviço? Esta ação não pode ser desfeita.')){
      db.servicosAvulsos = db.servicosAvulsos.filter(s=>s.id!==id);
      closeModal(); saveDB(); renderView();
    }
    return;
  }

  if(action === 'novo-cliente'){ modalCliente(null); return; }
  if(action === 'editar-cliente'){ modalCliente(getCliente(id)); return; }
  if(action === 'excluir-cliente'){
    if(confirm('Excluir este cliente? Todas as vagas, candidatos, colaboradores e cargos vinculados também serão removidos. Esta ação não pode ser desfeita.')){
      const candidatosDoClienteExcluido = db.candidatos.filter(c=>c.clienteId===id);
      const cargosDoClienteExcluido = cargosDoCliente(id);
      const funcoesDoClienteExcluido = funcoesDoCliente(id);
      cargosDoClienteExcluido.forEach(v=>{ if(v.vagaPublicaAtiva){ sincronizarVagaPublica(Object.assign({}, v, {vagaPublicaAtiva:false, status:'fechada'})); } });
      db.candidatos = db.candidatos.filter(c=>c.clienteId!==id);
      db.cargos = db.cargos.filter(v=>v.clienteId!==id);
      db.colaboradores = db.colaboradores.filter(c=>c.clienteId!==id);
      db.descritivosCargo = db.descritivosCargo.filter(d=>!funcoesDoClienteExcluido.some(f=>f.id===d.funcaoId));
      db.funcoes = db.funcoes.filter(f=>f.clienteId!==id);
      db.mensalidadesBPO = db.mensalidadesBPO.filter(m=>m.clienteId!==id);
      db.servicosAvulsos = db.servicosAvulsos.filter(s=>s.clienteId!==id);
      db.absenteismo = db.absenteismo.filter(a=>a.clienteId!==id);
      db.diagnosticosCultura = db.diagnosticosCultura.filter(d=>d.clienteId!==id);
      db.denuncias = db.denuncias.filter(d=>d.clienteId!==id);
      db.mensalidadesCanalDenuncia = db.mensalidadesCanalDenuncia.filter(m=>m.clienteId!==id);
      db.agenda.forEach(e=>{ if(e.clienteId===id) e.clienteId=''; });
      db.clientes = db.clientes.filter(c=>c.id!==id);
      candidatosDoClienteExcluido.forEach(c=>{ if(c.temCurriculo) removerCurriculoStorage(c.id); });
      removerLogoClienteStorage(id);
      if(state.viewClienteId === id) state.viewClienteId = '';
      if(state.colabClienteId === id) state.colabClienteId = '';
      if(state.mensClienteId === id) state.mensClienteId = '';
      closeModal(); saveDB(); renderView();
    }
    return;
  }

  if(action === 'nova-vaga'){ modalVaga(null, el.dataset.clienteId); return; }
  if(action === 'editar-vaga'){ modalVaga(getCargo(id)); return; }
  if(action === 'link-vaga'){ modalLinkVaga(getCargo(id)); return; }
  if(action === 'copiar-link-vaga'){
    const link = linkInscricao(id);
    const finalizar = ()=> showToast('Link copiado! Cole onde quiser divulgar a vaga.');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(finalizar).catch(()=>{
        const inp = document.getElementById('link-vaga-input'); if(inp){ inp.select(); document.execCommand('copy'); finalizar(); }
      });
    } else {
      const inp = document.getElementById('link-vaga-input'); if(inp){ inp.select(); document.execCommand('copy'); finalizar(); }
    }
    return;
  }
  if(action === 'fechar-vaga'){ modalFecharVaga(getCargo(id)); return; }
  if(action === 'avaliacao-comportamental'){ modalLinkAvaliacao(db.candidatos.find(c=>c.id===id)); return; }
  if(action === 'carta-proposta'){ modalCartaProposta(db.candidatos.find(c=>c.id===id)); return; }
  if(action === 'cp-copiar'){
    const campo = document.getElementById('cp-texto');
    if(!campo) return;
    const finalizar = ()=> showToast('Texto da proposta copiado!');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(campo.value).then(finalizar).catch(()=>{ campo.select(); document.execCommand('copy'); finalizar(); });
    } else { campo.select(); document.execCommand('copy'); finalizar(); }
    return;
  }
  if(action === 'copiar-link-avaliacao'){
    const link = linkAvaliacao(id);
    const finalizar = ()=> showToast('Link copiado! Envie para o candidato responder.');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(finalizar).catch(()=>{
        const inp = document.getElementById('link-avaliacao-input'); if(inp){ inp.select(); document.execCommand('copy'); finalizar(); }
      });
    } else {
      const inp = document.getElementById('link-avaliacao-input'); if(inp){ inp.select(); document.execCommand('copy'); finalizar(); }
    }
    return;
  }
  if(action === 'link-cultura'){ modalLinkCultura(getCliente(id)); return; }
  if(action === 'config-canal-denuncia'){ modalConfigCanalDenuncia(getCliente(id)); return; }
  if(action === 'link-canal-denuncia'){ modalLinkCanalDenuncia(getCliente(id)); return; }
  if(action === 'ver-denuncia'){ modalVerDenuncia(db.denuncias.find(d=>d.id===id)); return; }
  if(action === 'copiar-link-denuncia'){
    const link = linkCanalDenuncia(id);
    const finalizar = ()=> showToast('Link copiado!');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(finalizar).catch(()=>{
        const inp = document.getElementById('link-denuncia-input'); if(inp){ inp.select(); document.execCommand('copy'); finalizar(); }
      });
    } else {
      const inp = document.getElementById('link-denuncia-input'); if(inp){ inp.select(); document.execCommand('copy'); finalizar(); }
    }
    return;
  }
  if(action === 'copiar-mensagem-denuncia'){
    const campo = document.getElementById('texto-denuncia-mensagem');
    if(!campo) return;
    const finalizar = ()=> showToast('Mensagem copiada!');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(campo.value).then(finalizar).catch(()=>{ campo.select(); document.execCommand('copy'); finalizar(); });
    } else { campo.select(); document.execCommand('copy'); finalizar(); }
    return;
  }
  if(action === 'copiar-link-cultura'){
    const link = linkDiagnosticoCultura(id);
    const finalizar = ()=> showToast('Link copiado!');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(finalizar).catch(()=>{
        const inp = document.getElementById('link-cultura-input'); if(inp){ inp.select(); document.execCommand('copy'); finalizar(); }
      });
    } else {
      const inp = document.getElementById('link-cultura-input'); if(inp){ inp.select(); document.execCommand('copy'); finalizar(); }
    }
    return;
  }
  if(action === 'copiar-mensagem-cultura'){
    const campo = document.getElementById('texto-cultura-mensagem');
    if(!campo) return;
    const finalizar = ()=> showToast('Mensagem copiada!');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(campo.value).then(finalizar).catch(()=>{ campo.select(); document.execCommand('copy'); finalizar(); });
    } else { campo.select(); document.execCommand('copy'); finalizar(); }
    return;
  }
  if(action === 'reabrir-vaga'){
    const v = getCargo(id); v.status='aberta'; v.dataFechamentoReal=''; saveDB(); renderView();
    if(v.vagaPublicaAtiva){ sincronizarVagaPublica(v); }
    return;
  }

  if(action === 'ver-candidatos-vaga'){
    const v = getCargo(id); state.tab='candidatos'; state.candClienteId=v.clienteId; state.candCargoId=v.id; state.candStatus=''; state.candBusca=''; renderView(); return;
  }
  if(action === 'ver-relatorio-vaga'){
    const v = getCargo(id); state.tab='relatorio'; state.dashClienteId=v.clienteId; state.dashCargoId=v.id; renderView(); return;
  }
  if(action === 'dash-ir-vaga'){
    const v = getCargo(id); state.dashClienteId=v.clienteId; state.dashCargoId=v.id; renderView(); return;
  }

  if(action === 'importar-inscricoes'){
    importarInscricoes();
    return;
  }
  if(action === 'novo-candidato'){ modalCandidato(null, state.candCargoId || ''); return; }
  if(action === 'novo-candidato-banco'){ modalCandidato(null, '', true); return; }
  if(action === 'editar-candidato'){ modalCandidato(db.candidatos.find(c=>c.id===id)); return; }
  if(action === 'avancar-etapa'){ avancarProximaEtapa(id); return; }
  if(action === 'lote-avancar'){
    let n=0;
    state.candidatosSelecionados.forEach(cid=>{
      const c = db.candidatos.find(x=>x.id===cid);
      if(!c) return;
      const idx = c.etapas.findIndex(e=>e.resultado==='');
      if(idx===-1) return;
      c.etapas[idx].resultado = 'avancou';
      if(!c.etapas[idx].data) c.etapas[idx].data = todayISO();
      n++;
    });
    state.candidatosSelecionados.clear();
    saveDB(); renderView();
    showToast(n+' candidato(s) avançaram de etapa.');
    return;
  }
  if(action === 'lote-nao-avancou'){
    if(!confirm('Marcar a próxima etapa pendente como "Não avançou" para todos os selecionados?')) return;
    let n=0;
    state.candidatosSelecionados.forEach(cid=>{
      const c = db.candidatos.find(x=>x.id===cid);
      if(!c) return;
      const idx = c.etapas.findIndex(e=>e.resultado==='');
      if(idx===-1) return;
      c.etapas[idx].resultado = 'nao_avancou';
      if(!c.etapas[idx].data) c.etapas[idx].data = todayISO();
      n++;
    });
    state.candidatosSelecionados.clear();
    saveDB(); renderView();
    showToast(n+' candidato(s) marcados como não avançou.');
    return;
  }
  if(action === 'lote-banco'){
    let n=0;
    state.candidatosSelecionados.forEach(cid=>{
      const c = db.candidatos.find(x=>x.id===cid);
      if(!c || c.bancoDeCurriculos) return;
      c.bancoDeCurriculos = true;
      n++;
    });
    state.candidatosSelecionados.clear();
    saveDB(); renderView();
    showToast(n+' candidato(s) adicionados ao banco de currículos.');
    return;
  }
  if(action === 'lote-excluir'){
    const qtd = state.candidatosSelecionados.size;
    if(!confirm('Excluir '+qtd+' candidato(s) selecionado(s)? Esta ação não pode ser desfeita.')) return;
    state.candidatosSelecionados.forEach(cid=>{
      const c = db.candidatos.find(x=>x.id===cid);
      if(c && c.temCurriculo) removerCurriculoStorage(cid);
    });
    db.candidatos = db.candidatos.filter(c=>!state.candidatosSelecionados.has(c.id));
    state.candidatosSelecionados.clear();
    saveDB(); renderView();
    showToast(qtd+' candidato(s) excluído(s).');
    return;
  }
  if(action === 'lote-limpar'){ state.candidatosSelecionados.clear(); renderView(); return; }
  if(action === 'baixar-curriculo' || action === 'baixar-curriculo-modal'){
    const cand = db.candidatos.find(c=>c.id===id);
    baixarCurriculo(id, cand ? cand.nome : id);
    return;
  }
  if(action === 'excluir-candidato'){
    if(confirm('Excluir este candidato do processo? Esta ação não pode ser desfeita.')){
      const cand = db.candidatos.find(c=>c.id===id);
      db.candidatos = db.candidatos.filter(c=>c.id!==id);
      if(cand && cand.temCurriculo){ removerCurriculoStorage(id); }
      closeModal(); saveDB(); renderView();
    }
    return;
  }

  if(action === 'fechar-modal' || action === 'fechar-modal-overlay'){
    if(action==='fechar-modal-overlay' && e.target.id !== 'modal-slot' && !e.target.classList.contains('modal-overlay')) return;
    closeModal(); return;
  }

  if(action === 'testar-armazenamento-novamente'){
    showToast('Testando conexão e recarregando dados…');
    loadDB().then(dadosCarregados=>{
      if(dbCarregadoComSucesso){
        db = dadosCarregados;
        garantirConfiguracoes();
        renderView();
        esconderAvisoConfiguracao();
        showToast('Tudo certo! Dados recarregados e o armazenamento está funcionando.');
      } else {
        mostrarAvisoConfiguracao('🛑 <strong>Ainda não foi possível carregar seus dados salvos.</strong> Não cadastre nada agora. Verifique sua internet e tente de novo.');
        showToast('Ainda sem sucesso. Não cadastre nada até resolver isso.', true);
      }
    });
    return;
  }
  if(action === 'configurar-mensagens'){ modalConfigurarMensagens(); return; }
  if(action === 'recuperar-dados-antigos'){
    showToast('Procurando dados antigos…');
    lerStorageAntigo().then(dadosAntigos=>{
      if(!dadosAntigos || (dadosAntigos.clientes.length===0 && dadosAntigos.cargos.length===0 && dadosAntigos.candidatos.length===0)){
        showToast('Nenhum dado antigo encontrado nesta sessão.', true);
        return;
      }
      const resumo = dadosAntigos.clientes.length+' cliente(s), '+dadosAntigos.cargos.length+' vaga(s) e '+dadosAntigos.candidatos.length+' candidato(s)';
      if(confirm('Encontrei dados antigos: '+resumo+'. Deseja importar isso para o banco de dados atual (Google)? Isso vai SUBSTITUIR os dados atuais do painel.')){
        db = dadosAntigos;
        saveDB(true).then(ok=>{ if(ok){ renderView(); showToast('Dados antigos recuperados e salvos no Google com sucesso!'); } });
      }
    });
    return;
  }
  if(action === 'exportar-backup'){
    const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'backup-processos-seletivos-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return;
  }

  if(action === 'imprimir-relatorio'){ window.print(); return; }
}

function onGlobalChange(e){
  const t = e.target;
  if(t.classList && t.classList.contains('chk-candidato')){
    if(t.checked) state.candidatosSelecionados.add(t.dataset.id);
    else state.candidatosSelecionados.delete(t.dataset.id);
    renderView();
    return;
  }
  if(t.id === 'chk-todos-candidatos'){
    const linhas = document.querySelectorAll('.chk-candidato');
    if(t.checked){ linhas.forEach(chk=> state.candidatosSelecionados.add(chk.dataset.id)); }
    else { linhas.forEach(chk=> state.candidatosSelecionados.delete(chk.dataset.id)); }
    renderView();
    return;
  }
  if(t.dataset.role === 'dash-cliente'){ state.dashClienteId = t.value; state.dashCargoId=''; renderView(); return; }
  if(t.dataset.role === 'dash-cargo'){ state.dashCargoId = t.value; renderView(); return; }
  if(t.dataset.role === 'cand-cliente'){ state.candClienteId = t.value; state.candCargoId=''; renderView(); return; }
  if(t.dataset.role === 'cand-cargo'){ state.candCargoId = t.value; renderView(); return; }
  if(t.dataset.role === 'cand-status'){ state.candStatus = t.value; renderView(); return; }
  if(t.dataset.role === 'rel-cliente'){ state.dashClienteId = t.value; state.dashCargoId=''; renderView(); return; }
  if(t.dataset.role === 'rel-cargo'){ state.dashCargoId = t.value; renderView(); return; }
  if(t.dataset.role === 'fat-cliente'){ state.fatClienteId = t.value; renderView(); return; }
  if(t.dataset.role === 'fat-status'){ state.fatStatus = t.value; renderView(); return; }
  if(t.dataset.role === 'colab-cliente'){ state.colabClienteId = t.value; renderView(); return; }
  if(t.dataset.role === 'colab-status'){ state.colabStatus = t.value; renderView(); return; }
  if(t.dataset.role === 'mens-cliente'){ state.mensClienteId = t.value; renderView(); return; }
  if(t.dataset.role === 'mens-mes'){ state.mensMes = t.value; renderView(); return; }
  if(t.dataset.role === 'mens-status'){ state.mensStatus = t.value; renderView(); return; }
  if(t.dataset.role === 'serv-cliente'){ state.servClienteId = t.value; renderView(); return; }
  if(t.dataset.role === 'serv-tipo'){ state.servTipo = t.value; renderView(); return; }
  if(t.dataset.role === 'serv-status'){ state.servStatus = t.value; renderView(); return; }
  if(t.dataset.role === 'ind-cliente'){ state.indClienteId = t.value; renderView(); return; }
  if(t.dataset.role === 'den-cliente'){ state.denClienteId = t.value; renderView(); return; }
  if(t.dataset.role === 'ind-mes-inicio'){ state.indMesInicio = t.value; renderView(); return; }
  if(t.dataset.role === 'ind-mes-fim'){ state.indMesFim = t.value; renderView(); return; }
  if(t.dataset.role === 'dash-status-vaga'){ state.dashStatusVaga = t.value; renderView(); return; }
  if(t.dataset.role === 'banco-area'){ state.bancoArea = t.value; renderView(); return; }
  if(t.dataset.role === 'sel-cliente-vagas'){ state.viewClienteId = t.value; renderView(); return; }
  if(t.id === 'import-file'){
    const file = t.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed || !Array.isArray(parsed.clientes)) throw new Error('formato inválido');
        if(confirm('Importar este backup vai substituir todos os dados atuais. Deseja continuar?')){
          db = parsed; garantirConfiguracoes(); dbCarregadoComSucesso = true; saveDB(true); renderView(); showToast('Backup importado com sucesso.');
        }
      }catch(err){ showToast('Arquivo inválido. Verifique se é um backup exportado por este painel.', true); }
    };
    reader.readAsText(file);
    return;
  }
}

function onGlobalInput(e){
  const t = e.target;
  if(t.dataset.role === 'cand-busca'){
    state.candBusca = t.value;
    const caret = t.selectionStart;
    renderView();
    const novo = document.querySelector('[data-role="cand-busca"]');
    if(novo){ novo.focus(); try{ novo.setSelectionRange(caret, caret); }catch(err){} }
  }
  if(t.dataset.role === 'banco-busca'){
    state.bancoBusca = t.value;
    const caret = t.selectionStart;
    renderView();
    const novo = document.querySelector('[data-role="banco-busca"]');
    if(novo){ novo.focus(); try{ novo.setSelectionRange(caret, caret); }catch(err){} }
  }
  if(t.id === 'busca-global'){
    executarBuscaGlobal(t.value);
  }
}

/* ============================= INICIALIZAÇÃO ============================= */
(async function init(){
  const cargoIdPublico = getHashCargoId();
  const candidatoIdAvaliacao = getHashAvaliacaoId();
  const clienteIdCultura = getHashCulturaId();
  const clienteIdDenuncia = getHashDenunciaId();
  if(cargoIdPublico){
    await renderPublicApplication(cargoIdPublico);
  } else if(candidatoIdAvaliacao){
    await renderAvaliacaoComportamental(candidatoIdAvaliacao);
  } else if(clienteIdCultura){
    await renderDiagnosticoCultura(clienteIdCultura);
  } else if(clienteIdDenuncia){
    await renderCanalDenuncia(clienteIdDenuncia);
  } else {
    db = await loadDB();
    garantirConfiguracoes();
    renderShell();
    verificarPersistenciaInicial();
  }
})();
</script>
