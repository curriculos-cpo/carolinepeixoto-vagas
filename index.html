<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Processos Seletivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --bg:#F7F1E9;
    --panel:#FFFFFF;
    --ink:#3B2318;
    --ink-soft:#8A7263;
    --border:#E5D9CB;
    --spine:#2B1810;
    --spine-soft:#45291C;
    --spine-text:#F3E8DE;
    --spine-text-soft:#C9AB99;
    --accent:#B2573D;
    --accent-soft:#F1DED2;
    --green:#4C7A5A; --green-soft:#E6EFE6;
    --amber:#B8792B; --amber-soft:#F6E9D6;
    --red:#963A2C; --red-soft:#F1DFD8;
    --gray:#9C8C7C; --gray-soft:#EFE7DC;
    --radius:6px;
    --serif:'Playfair Display','Source Serif 4',Georgia,'Times New Roman',serif;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
  }
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0 0 4px 0;color:var(--ink);}
  #boot-loading{padding:60px;text-align:center;color:var(--ink-soft);font-family:var(--serif);font-size:18px;}
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}

  /* Sidebar */
  .sidebar{background:var(--spine);color:var(--spine-text);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--spine-soft) transparent;}
  .sidebar::-webkit-scrollbar{width:7px;}
  .sidebar::-webkit-scrollbar-track{background:transparent;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--spine-soft);border-radius:4px;}
  .brand{padding:0 6px 20px 6px;border-bottom:1px solid var(--spine-soft);margin-bottom:18px;text-align:center;}
  .brand img{width:100%;height:auto;display:block;margin:0 auto 10px auto;}
  .brand .app-title{font-family:var(--sans);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--spine-text-soft);font-weight:600;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;color:var(--spine-text-soft);cursor:pointer;font-weight:500;border-left:3px solid transparent;font-size:14px;}
  .nav-section-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--spine-text-soft);opacity:.6;padding:14px 12px 4px 12px;}
  .nav-section-label:first-child{padding-top:4px;}
  .nav-item:hover{background:var(--spine-soft);color:#fff;}
  .nav-item.active{background:var(--spine-soft);color:#fff;border-left:3px solid var(--accent);}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none;}
  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--spine-soft);font-size:11.5px;color:var(--spine-text-soft);}
  .global-search-wrap{position:relative;margin:14px 0 10px 0;}
  #busca-global{width:100%;padding:9px 10px;border-radius:5px;border:1px solid var(--spine-soft);background:var(--spine-soft);color:#fff;font-size:13px;font-family:var(--sans);}
  #busca-global::placeholder{color:var(--spine-text-soft);}
  #busca-global:focus{outline:2px solid var(--accent);background:#2c3b39;}
  #busca-global-resultados{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:340px;overflow-y:auto;z-index:150;display:none;}
  #busca-global-resultados.aberto{display:block;}
  .busca-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;color:var(--ink);}
  .busca-item:last-child{border-bottom:none;}
  .busca-item:hover{background:var(--accent-soft);}
  .busca-item .tipo{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);display:block;margin-bottom:1px;}
  .busca-item .sub{font-size:11.5px;color:var(--ink-soft);}
  .busca-vazio{padding:12px;font-size:12.5px;color:var(--ink-soft);text-align:center;}
  .save-state{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;}
  .sidebar-foot button{width:100%;margin-top:6px;}

  /* Main */
  main{padding:28px 36px 60px 36px;max-width:1280px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
  .topbar h1{font-size:23px;}
  .topbar p{color:var(--ink-soft);margin:0;font-size:13.5px;}
  .filters-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px;}
  .filters-row select,.filters-row input[type=search]{padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-family:var(--sans);font-size:13.5px;background:#fff;color:var(--ink);}

  /* Buttons */
  .btn{font-family:var(--sans);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:4px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#8F4530;}
  .btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--border);}
  .btn-secondary:hover{background:var(--gray-soft);}
  .btn-danger{background:#fff;color:var(--red);border:1px solid var(--red);}
  .btn-danger:hover{background:var(--red-soft);}
  .btn-ghost{background:transparent;color:var(--accent);border:1px solid transparent;padding:6px 8px;}
  .btn-ghost:hover{text-decoration:underline;}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  /* Cards */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px;}
  .agenda-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .agenda-dow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);text-align:center;padding-bottom:4px;}
  .agenda-dia{border:1px solid var(--border);border-radius:6px;min-height:66px;padding:5px 7px;cursor:pointer;font-size:12.5px;background:#fff;transition:border-color .1s;}
  .agenda-dia:hover{border-color:var(--accent);}
  .agenda-dia.hoje{border-color:var(--accent);border-width:2px;}
  .agenda-dia.selecionado{background:var(--accent-soft);}
  .agenda-dia.outro-mes{opacity:.32;}
  .agenda-dia .num{font-weight:700;}
  .agenda-pontos{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;}
  .agenda-ponto{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .agenda-ponto.concluido{background:var(--green);}
  .kpi{background:var(--panel);border:1px solid var(--border);border-bottom:3px solid var(--accent);border-radius:var(--radius);padding:14px 16px;}
  .kpi.c-green{border-bottom-color:var(--green);}
  .kpi.c-amber{border-bottom-color:var(--amber);}
  .kpi.c-red{border-bottom-color:var(--red);}
  .kpi .label{font-size:12px;color:var(--ink-soft);font-weight:500;margin-bottom:6px;}
  .kpi .value{font-family:var(--serif);font-size:27px;font-weight:600;color:var(--ink);}
  .kpi .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .charts-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px;}
  @media (max-width:900px){.charts-row{grid-template-columns:1fr;}}
  .chart-card h3{font-size:15px;margin-bottom:14px;}
  .chart-wrap{position:relative;height:260px;width:100%;}
  .chart-wrap canvas{display:block;}

  /* Dossier / client cards */
  .dossier{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .dossier-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer;gap:12px;flex-wrap:wrap;}
  .dossier-head:hover{background:#FAF9F6;}
  .dossier-title{display:flex;align-items:center;gap:10px;}
  .dossier-title h3{font-size:16.5px;}
  .dossier-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .dossier-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .dossier-body{border-top:1px solid var(--border);padding:14px 18px 18px 18px;background:#FCFBF9;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;padding:9px 10px;font-weight:600;color:var(--ink);background:var(--accent-soft);border-bottom:1px solid var(--border);}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink);}
  tbody tr:hover{background:#FAF9F6;}
  .table-wrap{overflow-x:auto;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state h3{color:var(--ink-soft);font-size:16px;}

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .badge-green{background:var(--green-soft);color:var(--green);}
  .badge-amber{background:var(--amber-soft);color:var(--amber);}
  .badge-red{background:var(--red-soft);color:var(--red);}
  .badge-gray{background:var(--gray-soft);color:var(--gray);border:1px solid var(--border);}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(43,24,16,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100;}
  .modal{background:#fff;border-radius:8px;max-width:760px;width:100%;padding:26px 28px 28px 28px;}
  .modal h2{font-size:19px;margin-bottom:2px;}
  .modal .modal-sub{color:var(--ink-soft);font-size:13px;margin-bottom:18px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .field input,.field select,.field textarea{padding:9px 10px;border:1px solid var(--border);border-radius:4px;font-family:var(--sans);font-size:13.5px;color:var(--ink);background:#fff;}
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .section-title{font-size:13.5px;font-weight:700;margin:18px 0 10px 0;padding-top:14px;border-top:1px solid var(--border);color:var(--ink);}
  .section-title:first-of-type{border-top:none;padding-top:0;margin-top:0;}
  .stage-table th,.stage-table td{padding:7px 8px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0;}
  .checkbox-row input{width:16px;height:16px;}
  .checkbox-row label{font-size:13.5px;font-weight:500;}
  .modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
  .modal-footer .right{display:flex;gap:8px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .status-pill-live{margin-top:6px;}

  /* Report */
  .report-header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px;}
  .report-header img{max-width:220px;height:auto;display:block;margin-bottom:14px;}
  .report-header h1{font-size:22px;}
  .report-header .tag{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .funnel-list{display:flex;flex-direction:column;gap:8px;margin:18px 0;}
  .funnel-item{display:grid;grid-template-columns:200px 1fr 50px;align-items:center;gap:10px;}
  .funnel-item .name{font-size:13px;color:var(--ink-soft);}
  .funnel-bar-bg{background:var(--gray-soft);border-radius:3px;height:16px;overflow:hidden;border:1px solid var(--border);}
  .funnel-bar{background:var(--accent);height:100%;}
  .funnel-item .num{font-weight:700;text-align:right;font-family:var(--serif);}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .toast.err{background:var(--red);}

  @media (max-width:820px){
    #app{grid-template-columns:1fr;}
    .sidebar{position:relative;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:14px 16px;}
    .brand{display:none;}
    .nav{flex-direction:row;}
    .sidebar-foot{display:none;}
    main{padding:20px;}
    .form-grid{grid-template-columns:1fr;}
    .funnel-item{grid-template-columns:120px 1fr 40px;}
  }

  @media print{
    .sidebar,.no-print{display:none !important;}
    #app{display:block;}
    main{padding:0;max-width:100%;}
    body{background:#fff;}
  }
</style>
</head>
<body>
<div id="aviso-armazenamento-slot"></div>
<div id="app"><div id="boot-loading">Carregando painel…</div></div>
<div id="modal-slot"></div>
<div id="toast-slot"></div>

<script>
/* ============================= DADOS ============================= */
let db = { clientes: [], cargos: [], candidatos: [] };
let lastSaved = null;

const STORAGE_KEY = 'rs_database';

/* ===== Integração com Google Apps Script (banco de dados do painel) =====
   Cole aqui a URL do seu App da Web (termina em /exec) depois de implantar o script.
   A partir de agora, TODOS os dados do painel (clientes, vagas, candidatos)
   são salvos nessa integração — não mais no armazenamento da Claude. */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCrtWqclwQbWMpW3cXA7Ipt-O5WaTG1BrqfTUFMC_TzUKlGPCy_Enct0U7RkBidvF50g/exec';

function appsScriptConfigurado(){ return !!APPS_SCRIPT_URL; }

async function chamarAppsScriptPost(action, payload, timeoutMs){
  if(!appsScriptConfigurado()) throw new Error('Integração com o Google ainda não foi configurada.');
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 25000);
  let res;
  try{
    res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action:action}, payload)),
      signal: controller.signal
    });
  }catch(err){
    if(err.name === 'AbortError') throw new Error('A conexão demorou demais para responder. Verifique sua internet e tente novamente.');
    throw err;
  }finally{
    clearTimeout(timer);
  }
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Falha na integração.');
  return data;
}

async function chamarAppsScriptGet(query, timeoutMs){
  if(!appsScriptConfigurado()) throw new Error('Integração com o Google ainda não foi configurada.');
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 25000);
  let res;
  try{
    res = await fetch(APPS_SCRIPT_URL + '?' + query, { signal: controller.signal });
  }catch(err){
    if(err.name === 'AbortError') throw new Error('A conexão demorou demais para responder. Verifique sua internet e tente novamente.');
    throw err;
  }finally{
    clearTimeout(timer);
  }
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Falha na integração.');
  return data;
}

/* ---- Utilitário mantido só para tentar recuperar dados antigos salvos no armazenamento da Claude ---- */
function esperarStorageAntigo(tentativas, intervaloMs){
  tentativas = tentativas || 10; intervaloMs = intervaloMs || 200;
  return new Promise(resolve=>{
    let i = 0;
    (function tentar(){
      if(window.storage && typeof window.storage.get === 'function'){ resolve(true); return; }
      i++;
      if(i >= tentativas){ resolve(false); return; }
      setTimeout(tentar, intervaloMs);
    })();
  });
}
async function lerStorageAntigo(){
  try{
    const pronto = await esperarStorageAntigo();
    if(!pronto) return null;
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      if(parsed && Array.isArray(parsed.clientes)) return parsed;
    }
  }catch(e){ /* nada salvo no armazenamento antigo */ }
  return null;
}

let dbCarregadoComSucesso = false;

async function loadDB(){
  if(!appsScriptConfigurado()) return { clientes: [], cargos: [], candidatos: [] };
  try{
    const resp = await chamarAppsScriptGet('action=getAll');
    if(resp.db && Array.isArray(resp.db.clientes) && Array.isArray(resp.db.cargos) && Array.isArray(resp.db.candidatos)){
      dbCarregadoComSucesso = true;
      return resp.db;
    }
  }catch(e){ /* erro de conexão — tratado abaixo */ }
  dbCarregadoComSucesso = false;
  return { clientes: [], cargos: [], candidatos: [] };
}

async function saveDB(forcar){
  if(!appsScriptConfigurado()){
    mostrarAvisoConfiguracao();
    return false;
  }
  if(!dbCarregadoComSucesso){
    mostrarAvisoConfiguracao('🛑 <strong>Salvamento bloqueado por segurança:</strong> os dados salvos não foram carregados corretamente ao abrir a página. Para não haver risco de apagar informações existentes, nada será salvo até você recarregar a página (F5) e confirmar que os cadastros aparecem certinho.');
    showToast('Salvamento bloqueado: os dados não foram carregados corretamente. Recarregue a página.', true);
    return false;
  }
  try{
    await chamarAppsScriptPost('saveAll', {db: db, forcar: !!forcar});
    lastSaved = new Date();
    renderSaveState();
    esconderAvisoConfiguracao();
    return true;
  }catch(e){
    showToast(e.message || 'Não foi possível salvar agora. Verifique sua conexão com a internet e tente novamente.', true);
    mostrarAvisoConfiguracao('⚠️ Não foi possível salvar agora. O que você digitar pode não ser gravado. Verifique sua conexão e clique em "Testar novamente".');
    return false;
  }
}

async function testarConectividade(){
  if(!appsScriptConfigurado()) return false;
  try{
    const resp = await chamarAppsScriptGet('action=ping');
    return !!resp.ok;
  }catch(e){
    return false;
  }
}

function mostrarAvisoConfiguracao(mensagemCustom){
  const slot = document.getElementById('aviso-armazenamento-slot');
  if(!slot) return;
  const msg = mensagemCustom || '⚠️ <strong>A integração com o Google ainda não foi configurada.</strong> Nada será salvo até isso ser concluído — fale com quem administra o painel para finalizar a configuração.';
  slot.innerHTML = `
    <div id="aviso-armazenamento" style="background:#963A2C;color:#fff;padding:12px 20px;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center;">
      <span>${msg}</span>
      <span class="btn btn-secondary btn-sm" data-action="testar-armazenamento-novamente" style="background:#fff;color:#963A2C;">Testar novamente</span>
    </div>`;
}
function esconderAvisoConfiguracao(){
  const slot = document.getElementById('aviso-armazenamento-slot');
  if(slot) slot.innerHTML = '';
}
async function verificarPersistenciaInicial(){
  if(!appsScriptConfigurado()){ mostrarAvisoConfiguracao(); return false; }
  if(!dbCarregadoComSucesso){
    mostrarAvisoConfiguracao('🛑 <strong>Não foi possível carregar seus dados salvos.</strong> Por segurança, o salvamento foi bloqueado. NÃO cadastre nada agora — clique em "Testar novamente" ou recarregue a página (F5).');
    return false;
  }
  const ok = await testarConectividade();
  if(!ok){ mostrarAvisoConfiguracao('⚠️ Não foi possível conectar à integração com o Google agora. Verifique sua internet e tente novamente.'); }
  else { esconderAvisoConfiguracao(); }
  return ok;
}

function showToast(msg, isErr){
  const slot = document.getElementById('toast-slot');
  slot.innerHTML = '<div class="toast '+(isErr?'err':'')+'">'+esc(msg)+'</div>';

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
function todayISO(){ const d = new Date(); const tz = d.getTimezoneOffset()*60000; return new Date(d-tz).toISOString().slice(0,10); }
function formatDate(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return d+'/'+m+'/'+y; }
function daysBetween(a,b){ if(!a||!b) return null; const d1=new Date(a), d2=new Date(b); return Math.round((d2-d1)/86400000); }

function dataMenosMeses(dataISO, meses){
  const d = new Date(dataISO+'T00:00:00');
  d.setMonth(d.getMonth() - meses);
  return d.toISOString().slice(0,10);
}
function dataMaisDias(dataISO, dias){
  const d = new Date(dataISO+'T00:00:00');
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0,10);
}
function prazosExperiencia(colaborador){
  if(!colaborador.dataAdmissao) return null;
  const dias1 = parseInt(colaborador.duracaoExperiencia1, 10) || 45;
  const dias2 = parseInt(colaborador.duracaoExperiencia2, 10) || 45;
  const fimEtapa1 = dataMaisDias(colaborador.dataAdmissao, dias1);
  const fimEtapa2 = dataMaisDias(colaborador.dataAdmissao, dias1 + dias2);
  const avaliadoEtapa1 = (colaborador.avaliacoesExperiencia||[]).some(a=>a.periodo==='etapa1');
  const avaliadoEtapa2 = (colaborador.avaliacoesExperiencia||[]).some(a=>a.periodo==='etapa2');
  return { dias1, dias2, fimEtapa1, fimEtapa2, avaliadoEtapa1, avaliadoEtapa2 };
}
const LIMITE_DIAS_ALERTA_EXPERIENCIA = 10;
function colaboradoresComExperienciaVencendo(clienteIdFiltro){
  const hoje = todayISO();
  const resultado = [];
  db.colaboradores.forEach(c=>{
    if(statusColaborador(c)==='desligado') return;
    const cliente = getCliente(c.clienteId);
    if(!cliente || cliente.tipoServico!=='bpo') return;
    if(clienteIdFiltro && c.clienteId!==clienteIdFiltro) return;
    const prazos = prazosExperiencia(c);
    if(!prazos) return;
    [

function calcularTurnover(clienteId, dataInicio, dataFim){
  const todos = colaboradoresDoCliente(clienteId);
  const ativoEm = (c, data) => c.dataAdmissao && c.dataAdmissao <= data && (!c.dataDesligamento || c.dataDesligamento > data);
  const ativosInicio = todos.filter(c=>ativoEm(c, dataInicio)).length;
  const ativosFim = todos.filter(c=>ativoEm(c, dataFim)).length;
  const admitidos = todos.filter(c=>c.dataAdmissao && c.dataAdmissao >= dataInicio && c.dataAdmissao <= dataFim).length;
  const desligados = todos.filter(c=>c.dataDesligamento && c.dataDesligamento >= dataInicio && c.dataDesligamento <= dataFim).length;
  const media = (ativosInicio + ativosFim) / 2;
  // Fórmula: ((admissões + desligamentos) / 2) ÷ colaboradores ativos × 100
  const taxa = media > 0 ? Math.round((((admitidos + desligados) / 2) / media) * 1000) / 10 : 0;
  return { ativosAtuais: ativosFim, admitidos, desligados, taxa };
}

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function extrairTextoArquivo(file){
  const nome = (file.name||'').toLowerCase();
  if(file.type === 'application/pdf' || nome.endsWith('.pdf')){
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
    let texto = '';
    const maxPaginas = Math.min(pdf.numPages, 6);
    for(let i=1; i<=maxPaginas; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      texto += content.items.map(it=>it.str).join(' ') + '\n';
    }
    return texto;
  }
  if(nome.endsWith('.docx')){
    const buffer = await file.arrayBuffer();
    const resultado = await mammoth.extractRawText({arrayBuffer: buffer});
    return resultado.value;
  }
  throw new Error('Não consigo ler automaticamente arquivos .doc antigos — funciona com PDF ou .docx.');
}

function extrairContatosDoTexto(texto){
  const linhas = texto.split('\n').map(l=>l.trim()).filter(Boolean);

  const emailMatch = texto.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);
  const email = emailMatch ? emailMatch[0] : '';

  const telefoneMatch = texto.match(/(\(?\d{2}\)?\s?)?9?\d{4}[-.\s]?\d{4}/);
  const telefone = telefoneMatch ? telefoneMatch[0].replace(/\s+/g,' ').trim() : '';

  const palavrasIgnoradas = /curr[íi]culo|resume|cv\b|endere[çc]o|objetivo|perfil|linkedin|github|@|http|www\./i;
  let nome = '';
  for(const linha of linhas.slice(0, 8)){
    if(linha.length < 4 || linha.length > 60) continue;
    if(/\d/.test(linha)) continue;
    if(palavrasIgnoradas.test(linha)) continue;
    const palavras = linha.split(/\s+/);
    if(palavras.length < 2 || palavras.length > 5) continue;
    nome = linha;
    break;
  }

  return { nome, email, telefone };
}

/* ---- Logo do cliente ---- */
const TAMANHO_MAX_LOGO = 10 * 1024 * 1024; // 10MB no arquivo original (será comprimido antes de salvar)

function redimensionarImagem(file, maxDim, qualidade){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let largura = img.width, altura = img.height;
        if(largura > maxDim || altura > maxDim){
          if(largura >= altura){ altura = Math.round(altura * (maxDim/largura)); largura = maxDim; }
          else { largura = Math.round(largura * (maxDim/altura)); altura = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = largura; canvas.height = altura;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, largura, altura);
        ctx.drawImage(img, 0, 0, largura, altura);
        canvas.toBlob(blob=>{
          if(!blob){ reject(new Error('Não foi possível processar esta imagem.')); return; }
          const novoNome = (file.name || 'logo').replace(/\.[^.]+$/, '') + '.jpg';
          resolve(new File([blob], novoNome, {type:'image/jpeg'}));
        }, 'image/jpeg', qualidade);
      };
      img.onerror = ()=> reject(new Error('Não foi possível abrir esta imagem. Tente outro arquivo.'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=> reject(new Error('Não foi possível ler o arquivo.'));
    reader.readAsDataURL(file);
  });
}

async function salvarLogoCliente(clienteId, file){
  if(file.size > TAMANHO_MAX_LOGO){
    throw new Error('Imagem muito grande (máximo de 10MB). Tente uma versão mais leve da logo.');
  }
  let arquivoFinal = file;
  try{
    arquivoFinal = await redimensionarImagem(file, 480, 0.85);
  }catch(e){
    /* se a compressão falhar por algum motivo, tenta salvar o arquivo original mesmo assim */
  }
  const dataUrl = await lerArquivoBase64(arquivoFinal);
  const resp = await chamarAppsScriptPost('uploadLogo', {clienteId: clienteId, imagemBase64: dataUrl, nomeArquivo: arquivoFinal.name, tipoArquivo: arquivoFinal.type});
  return { filename: arquivoFinal.name, url: resp.url };
}

  const map = { pendente:['Pendente','red'], parcial:['Parcial','amber'], pago:['Pago','green'] };
  const [label,color] = map[v.statusPagamento] || ['—','gray'];
  return '<span class="badge badge-'+color+'">'+esc(label)+'</span>';
}

function curriculosRecebidosCargo(v){
  const manual = v.curriculosRecebidos;
  if(manual === undefined || manual === null || manual === '') return candidatosDoCargo(v.id).length;
  return Number(manual) || 0;
}
function somaCurriculosRecebidos(cargosArr){ return cargosArr.reduce((s,v)=> s + curriculosRecebidosCargo(v), 0); }
function cargosDoCliente(clienteId){ return db.cargos.filter(v => v.clienteId === clienteId); }
function candidatosDoCargo(cargoId){ return db.candidatos.filter(c => c.cargoId === cargoId); }
function candidatosDoCliente(clienteId){ return db.candidatos.filter(c => c.clienteId === clienteId); }
function getCliente(id){ return db.clientes.find(x=>x.id===id); }
function getCargo(id){ return db.cargos.find(x=>x.id===id); }

  `;

    }

      const resultados = document.getElementById('busca-global-resultados');
      if(resultados) resultados.classList.remove('aberto');
    }
  });

  renderView();

function executarBuscaGlobal(termo){
  const resultados = document.getElementById('busca-global-resultados');
  if(!resultados) return;
  if(!termo || termo.trim().length < 2){ resultados.classList.remove('aberto'); resultados.innerHTML=''; return; }
  const t = termo.toLowerCase();
  const itens = [];
  db.clientes.forEach(cl=>{ if(cl.nome.toLowerCase().includes(t)) itens.push({tipo:'cliente', id:cl.id, label:cl.nome, sub:'Cliente'}); });
  db.cargos.forEach(v=>{ if(v.titulo.toLowerCase().includes(t)){ const cl=getCliente(v.clienteId); itens.push({tipo:'vaga', id:v.id, label:v.titulo, sub:'Vaga · '+(cl?cl.nome:'')}); } });
  db.candidatos.forEach(c=>{ if(c.nome.toLowerCase().includes(t)){ const v=getCargo(c.cargoId); itens.push({tipo:'candidato', id:c.id, label:c.nome, sub:'Candidato'+(v?' · '+v.titulo:'')}); } });

  if(itens.length===0){ resultados.innerHTML = '<div class="busca-vazio">Nada encontrado.</div>'; resultados.classList.add('aberto'); return; }
  resultados.innerHTML = itens.slice(0,10).map(it=>`<div class="busca-item" data-action="ir-busca" data-tipo="${it.tipo}" data-id="${it.id}"><span class="tipo">${esc(it.tipo)}</span>${esc(it.label)}<div class="sub">${esc(it.sub)}</div></div>`).join('');
  resultados.classList.add('aberto');
}

function irParaResultadoBusca(tipo, id){
  const resultados = document.getElementById('busca-global-resultados');
  if(resultados){ resultados.classList.remove('aberto'); resultados.innerHTML=''; }
  const campo = document.getElementById('busca-global');
  if(campo) campo.value = '';
  if(tipo==='cliente'){ state.tab='clientes'; state.viewClienteId=id; renderView(); }
  else if(tipo==='vaga'){ const v=getCargo(id); if(v){ state.tab='clientes'; state.viewClienteId=v.clienteId; renderView(); } }
  else if(tipo==='candidato'){ const c=db.candidatos.find(x=>x.id===id); if(c) modalCandidato(c); }
}

const TIPOS_AGENDA = ['Reunião', 'Entrevista', 'Ligação', 'Tarefa', 'Lembrete', 'Outro'];
const CORES_TIPO_AGENDA = { 'Reunião':'#B2573D', 'Entrevista':'#8C6A4B', 'Ligação':'#4C8C6B', 'Tarefa':'#C9A24B', 'Lembrete':'#6B7C93', 'Outro':'#8C8C8C' };

function eventosDoDia(dataISO){
  return db.agenda.filter(e=>e.data===dataISO).sort((a,b)=> (a.hora||'99:99').localeCompare(b.hora||'99:99'));
}
function proximosEventos(diasLimite){
  const hoje = todayISO();
  const fim = dataMaisDias(hoje, diasLimite);
  return db.agenda.filter(e=> !e.concluido && e.data>=hoje && e.data<=fim).sort((a,b)=> a.data.localeCompare(b.data) || (a.hora||'99:99').localeCompare(b.hora||'99:99'));
}
function primeiroDiaSemanaDoMes(mesRef){
  const [y,m] = mesRef.split('-').map(Number);
  return new Date(y, m-1, 1).getDay();
}
function diasNoMes(mesRef){
  const [y,m] = mesRef.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function mesAdjacente(mesRef, delta){
  let [y,m] = mesRef.split('-').map(Number);
  m += delta;
  if(m>12){ m=1; y++; } else if(m<1){ m=12; y--; }
  return y+'-'+String(m).padStart(2,'0');
}
function nomeMes(mesRef){
  const nomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [y,m] = mesRef.split('-').map(Number);
  return nomes[m-1] + ' de ' + y;
}

function viewAgenda(){
  const mesRef = state.agendaMes;
  const hoje = todayISO();
  const diaSelecionado = state.agendaDiaSelecionado;
  const primeiroDow = primeiroDiaSemanaDoMes(mesRef);
  const totalDias = diasNoMes(mesRef);
  const mesAnteriorRef = mesAdjacente(mesRef, -1);
  const diasMesAnterior = diasNoMes(mesAnteriorRef);

  const celulas = [];
  for(let i=0; i<primeiroDow; i++){
    const dia = diasMesAnterior - primeiroDow + 1 + i;
    celulas.push({ dataISO: mesAnteriorRef+'-'+String(dia).padStart(2,'0'), dia, outroMes:true });
  }
  for(let d=1; d<=totalDias; d++){
    celulas.push({ dataISO: mesRef+'-'+String(d).padStart(2,'0'), dia:d, outroMes:false });
  }
  const mesProximoRef = mesAdjacente(mesRef, 1);
  let diaProx = 1;
  while(celulas.length % 7 !== 0){
    celulas.push({ dataISO: mesProximoRef+'-'+String(diaProx).padStart(2,'0'), dia:diaProx, outroMes:true });
    diaProx++;
  }

  const diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const gradeHtml = celulas.map(cel=>{
    const eventosDia = eventosDoDia(cel.dataISO);
    const classes = ['agenda-dia'];
    if(cel.outroMes) classes.push('outro-mes');
    if(cel.dataISO===hoje) classes.push('hoje');
    if(cel.dataISO===diaSelecionado) classes.push('selecionado');
    return `<div class="${classes.join(' ')}" data-action="agenda-selecionar-dia" data-data="${cel.dataISO}">
      <div class="num">${cel.dia}</div>
      <div class="agenda-pontos">${eventosDia.slice(0,6).map(e=>'<span class="agenda-ponto'+(e.concluido?' concluido':'')+'" style="background:'+(e.concluido?'':CORES_TIPO_AGENDA[e.tipo]||'#B2573D')+';"></span>').join('')}</div>
    </div>`;
  }).join('');

  const eventosSelecionado = eventosDoDia(diaSelecionado);
  const proximos = proximosEventos(14).filter(e=>e.data!==diaSelecionado);

  const linhaEvento = (e) => {
    const cliente = e.clienteId ? getCliente(e.clienteId) : null;
    return `<div class="card" style="padding:10px 14px;margin-bottom:8px;${e.concluido?'opacity:.6;':''}border-left:3px solid ${CORES_TIPO_AGENDA[e.tipo]||'#B2573D'};">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:start;">
        <div>
          <strong>${e.hora?esc(e.hora)+' · ':''}${esc(e.titulo)}</strong>
          <div class="hint">${esc(e.tipo)}${cliente?' · '+esc(cliente.nome):''}${e.data!==diaSelecionado?' · '+formatDate(e.data):''}</div>
          ${e.descricao ? '<p style="margin:6px 0 0 0;font-size:13px;white-space:pre-line;">'+esc(e.descricao)+'</p>' : ''}
        </div>
        <div style="white-space:nowrap;">
          ${e.tipo==='Reunião' ? '<span class="btn btn-ghost btn-sm" data-action="abrir-ata" data-id="'+e.id+'">📄 Ata</span>' : ''}
          <span class="btn btn-ghost btn-sm" data-action="agenda-concluir" data-id="${e.id}">${e.concluido?'↺ Reabrir':'✓ Concluir'}</span>
          <span class="btn btn-ghost btn-sm" data-action="agenda-editar" data-id="${e.id}">Editar</span>
          <span class="btn btn-ghost btn-sm" data-action="agenda-excluir" data-id="${e.id}">Excluir</span>
        </div>
      </div>
    </div>`;
  };

  return `
    <div class="topbar">
      <div><h1>Agenda</h1><p>Seus horários e demandas, tudo num lugar só.</p></div>
      <button class="btn btn-primary" data-action="agenda-novo" data-data="${diaSelecionado}">+ Novo compromisso</button>
    </div>

    <div class="card" style="margin-bottom:22px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <span class="btn btn-secondary btn-sm" data-action="agenda-mes" data-delta="-1">← Anterior</span>
        <h3 style="margin:0;font-size:16px;">${nomeMes(mesRef)}</h3>
        <span class="btn btn-secondary btn-sm" data-action="agenda-mes" data-delta="1">Próximo →</span>
      </div>
      <div class="agenda-grid">
        ${diasSemana.map(d=>'<div class="agenda-dow">'+d+'</div>').join('')}
        ${gradeHtml}
      </div>
    </div>

    <div class="card" style="margin-bottom:22px;">
      <h3 style="font-size:15px;margin-bottom:12px;">${diaSelecionado===hoje?'Hoje':formatDate(diaSelecionado)} — ${eventosSelecionado.length} compromisso(s)</h3>
      ${eventosSelecionado.length===0 ? '<p class="hint">Nada agendado para este dia.</p>' : eventosSelecionado.map(linhaEvento).join('')}
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:12px;">Próximos 14 dias</h3>
      ${proximos.length===0 ? '<p class="hint">Nada agendado nos próximos 14 dias.</p>' : proximos.map(linhaEvento).join('')}
    </div>
  `;
}

function montarTextoAta(evento){
  const cliente = evento.clienteId ? getCliente(evento.clienteId) : null;

  let texto = 'ATA DE REUNIÃO\n';
  texto += '========================================\n\n';
  texto += 'Assunto: ' + evento.titulo + '\n';
  texto += 'Data: ' + formatDate(evento.data) + (evento.hora ? ' às ' + evento.hora : '') + '\n';
  if(cliente) texto += 'Cliente: ' + cliente.nome + '\n';
  texto += '\n';
  if(ata.participantes) texto += 'PARTICIPANTES\n' + ata.participantes + '\n\n';
  if(evento.descricao) texto += 'PAUTA\n' + evento.descricao + '\n\n';
  if(ata.decisoes) texto += 'DECISÕES TOMADAS\n' + ata.decisoes + '\n\n';
  if(ata.proximosPassos) texto += 'PRÓXIMOS PASSOS\n' + ata.proximosPassos + '\n\n';

  return texto;

}

/* ============================= BANCO DE CURRÍCULOS ============================= */
function viewBancoCurriculos(){

/* ============================= FATURAMENTO ============================= */
function viewFaturamento(){
  const clientesOpts = db.clientes.map(c=>'<option value="'+c.id+'" '+(state.fatClienteId===c.id?'selected':'')+'>'+esc(c.nome)+'</option>').join('');

  let cargos = state.fatClienteId ? cargosDoCliente(state.fatClienteId) : db.cargos;
  if(state.fatStatus) cargos = cargos.filter(v=>v.statusPagamento===state.fatStatus);

  const totalContratado = cargos.reduce((s,v)=>s+valorContratadoCargo(v),0);
  const totalRecebido = cargos.reduce((s,v)=>s+valorRecebidoCargo(v),0);
  const totalPendente = cargos.reduce((s,v)=>s+valorPendenteCargo(v),0);
  const vagasPendentes = cargos.filter(v=>v.statusPagamento==='pendente' && valorContratadoCargo(v)>0).length;
  const vagasPagas = cargos.filter(v=>v.statusPagamento==='pago' && valorContratadoCargo(v)>0).length;
  const vagasSemValor = cargos.filter(v=>valorContratadoCargo(v)===0).length;

  const linhas = cargos.slice().sort((a,b)=> valorPendenteCargo(b) - valorPendenteCargo(a)).map(v=>{
    const cl = getCliente(v.clienteId);
    return `<tr>
      <td>${esc(cl?.nome||'—')}</td>
      <td><strong>${esc(v.titulo)}</strong></td>
      <td>${cargoStatusBadge(v.status)} ${contratacaoBadge(v)}</td>
      <td>${formatMoeda(valorContratadoCargo(v))}</td>
      <td>${statusPagamentoBadge(v)}</td>

      valor: f.get('valor'),

function mesesEntre(inicio, fim){
  const meses = [];
  let [y,m] = inicio.split('-').map(Number);
  const [yFim,mFim] = fim.split('-').map(Number);
  let guarda = 0;
  while((y < yFim || (y===yFim && m<=mFim)) && guarda<240){
    meses.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
    guarda++;
  }
  return meses;
}

function calcularIndicadoresCompletos(clienteId, mesIni, mesFim){
  const cliente = getCliente(clienteId);
  const cargos = cargosDoCliente(clienteId);
  const candidatos = db.candidatos.filter(c=>c.clienteId===clienteId);
  const de = primeiroDiaDoMes(mesIni);
  const ate = ultimoDiaDoMes(mesFim);

  const vagasAbertasPeriodo = cargos.filter(v=>v.dataAbertura && v.dataAbertura>=de && v.dataAbertura<=ate).length;
  const vagasFechadasArr = cargos.filter(v=>v.status==='fechada' && v.dataFechamentoReal && v.dataFechamentoReal>=de && v.dataFechamentoReal<=ate);
  const vagasFechadasPeriodo = vagasFechadasArr.length;
  const temposContratacao = vagasFechadasArr.map(v=>daysBetween(v.dataAbertura, v.dataFechamentoReal)).filter(d=>d!==null && d>=0);
  const tempoMedioContratacao = temposContratacao.length ? Math.round(temposContratacao.reduce((a,b)=>a+b,0)/temposContratacao.length) : null;

  const candidatosPeriodo = candidatos.filter(c=>c.dataRecebimento && c.dataRecebimento>=de && c.dataRecebimento<=ate);
  const taxaConversao = candidatosPeriodo.length ? Math.round((vagasFechadasPeriodo/candidatosPeriodo.length)*1000)/10 : 0;
  const candidatosPorVagaFechada = vagasFechadasPeriodo>0 ? Math.round((candidatosPeriodo.length/vagasFechadasPeriodo)*10)/10 : null;

  let bpo = null;
  if(cliente && cliente.tipoServico==='bpo'){
    const meses = mesesEntre(mesIni, mesFim);
    const historicoMensal = meses.map(mm=>turnoverPorMes(clienteId, mm));
    const turnoverMedio = historicoMensal.length ? Math.round((historicoMensal.reduce((s,h)=>s+h.taxa,0)/historicoMensal.length)*10)/10 : 0;
    const acumulado = calcularTurnover(clienteId, de, ate);
    const indiceRetencao = Math.round((100-turnoverMedio)*10)/10;
    const admitidosPeriodo = historicoMensal.reduce((s,h)=>s+h.admitidos,0);
    const desligadosPeriodo = historicoMensal.reduce((s,h)=>s+h.desligados,0);
    const ativosAtuais = colaboradoresDoCliente(clienteId).filter(c=>statusColaborador(c)!=='desligado').length;
    const registrosAbsenteismo = db.absenteismo.filter(a=>a.clienteId===clienteId && a.mesReferencia>=mesIni && a.mesReferencia<=mesFim);
    const horasPrevistasTotal = registrosAbsenteismo.reduce((s,a)=>s+(parseFloat(a.horasPrevistas)||0),0);
    const horasPerdidasTotal = registrosAbsenteismo.reduce((s,a)=>s+(parseFloat(a.horasPerdidas)||0),0);
    const absenteismoPct = horasPrevistasTotal>0 ? Math.round((horasPerdidasTotal/horasPrevistasTotal)*1000)/10 : 0;
    bpo = { turnoverMedio, taxaAcumulada: acumulado.taxa, indiceRetencao, admitidosPeriodo, desligadosPeriodo, ativosAtuais, horasPrevistasTotal, horasPerdidasTotal, absenteismoPct, temRegistrosAbsenteismo: registrosAbsenteismo.length>0 };
  }

  return { vagasAbertasPeriodo, vagasFechadasPeriodo, tempoMedioContratacao, candidatosInscritosPeriodo: candidatosPeriodo.length, taxaConversao, candidatosPorVagaFechada, bpo };
}

  `;

let chartsIndicadores = {};
function destruirChartIndicador(id){
  if(chartsIndicadores[id]){ try{ chartsIndicadores[id].destroy(); }catch(e){} delete chartsIndicadores[id]; }
}

function drawIndicadoresCharts(){
  if(!window.Chart || !state.indClienteId) return;
  const cliente = getCliente(state.indClienteId);
  if(!cliente) return;

  const [mesIni, mesFim] = periodoEfetivoIndicadores();
  const cargos = cargosDoCliente(cliente.id);
  const de = primeiroDiaDoMes(mesIni);
  const ate = ultimoDiaDoMes(mesFim);
  let candidatosCliente = db.candidatos.filter(c=>c.clienteId===cliente.id && c.dataRecebimento && c.dataRecebimento>=de && c.dataRecebimento<=ate);

  const ctxFunil = document.getElementById('chart-funil-ind');
  destruirChartIndicador('chart-funil-ind');
  if(ctxFunil && cargos.length>0){
    const m = metricsForCandidatos(candidatosCliente);
    chartsIndicadores['chart-funil-ind'] = new Chart(ctxFunil, {
      type: 'bar',
      data: {
        labels: ['Cadastrados','Chamados','Avaliação','Gestor','Proposta','Contratados'],
        datasets: [{ data: [m.recebidos, m.chamados, m.avaliacao, m.gestor, m.propostas, m.contratados], backgroundColor: '#B2573D' }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}} }
    });
  }

  const ctxStatus = document.getElementById('chart-status-ind');
  destruirChartIndicador('chart-status-ind');
  if(ctxStatus && cargos.length>0){
    const counts = {em_processo:0, contratado:0, nao_avancou:0, declinou:0};
    candidatosCliente.forEach(c=>{ const s = statusCandidato(c); if(counts[s]!==undefined) counts[s]++; });
    chartsIndicadores['chart-status-ind'] = new Chart(ctxStatus, {
      type: 'doughnut',
      data: {
        labels: ['Em processo','Contratado','Não avançou','Declinou'],
        datasets: [{ data: [counts.em_processo, counts.contratado, counts.nao_avancou, counts.declinou], backgroundColor: ['#C9A24B','#4C8C6B','#B23A3A','#8C8C8C'] }]
      },
      options: { responsive:true, maintainAspectRatio:false }
    });
  }

  if(cliente.tipoServico==='bpo'){
    const ctxTurnover = document.getElementById('chart-turnover-ind');
    destruirChartIndicador('chart-turnover-ind');
    if(ctxTurnover){
      const mesesPeriodo = mesesEntre(mesIni, mesFim);
      const historico = mesesPeriodo.map(mm=>Object.assign({mes:mm}, turnoverPorMes(cliente.id, mm)));
      chartsIndicadores['chart-turnover-ind'] = new Chart(ctxTurnover, {
        type: 'line',
        data: {
          labels: historico.map(h=>formatMesRef(h.mes)),
          datasets: [{ label:'Turnover %', data: historico.map(h=>h.taxa), borderColor:'#B2573D', backgroundColor:'rgba(178,87,61,0.15)', fill:true, tension:0.3 }]
        },
        options: { responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true}} }
      });
    }

    const ctxFat = document.getElementById('chart-fatmens-ind');
    destruirChartIndicador('chart-fatmens-ind');
    if(ctxFat){
      let mesesMens = Array.from(new Set(db.mensalidadesBPO.filter(m=>m.clienteId===cliente.id).map(m=>m.mesReferencia))).sort();
      if(mesesMens.length) mesesMens = mesesMens.filter(mm=> mm>=mesIni && mm<=mesFim);
      if(mesesMens.length>0){
        const recebidoPorMes = mesesMens.map(mm => db.mensalidadesBPO.filter(m=>m.clienteId===cliente.id && m.mesReferencia===mm && m.statusPagamento==='pago').reduce((s,m)=>s+(parseFloat(m.valor)||0),0));
        const pendentePorMes = mesesMens.map(mm => db.mensalidadesBPO.filter(m=>m.clienteId===cliente.id && m.mesReferencia===mm && m.statusPagamento==='pendente').reduce((s,m)=>s+(parseFloat(m.valor)||0),0));
        chartsIndicadores['chart-fatmens-ind'] = new Chart(ctxFat, {
          type: 'bar',
          data: {
            labels: mesesMens.map(formatMesRef),
            datasets: [
              { label:'Recebido', data: recebidoPorMes, backgroundColor:'#4C8C6B' },
              { label:'Pendente', data: pendentePorMes, backgroundColor:'#C9A24B' }
            ]
          },
          options: { responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true}} }
        });
      }
    }
  }
}

        <div class="tag">Abertura em ${formatDate(cargo.dataAbertura)}${cargo.dataFechamentoReal ? ' · Fechada em '+formatDate(cargo.dataFechamentoReal) : ''} · Vagas: ${cargo.quantidadeVagas||1}</div>

          const conv = (anterior && anterior>0) ? Math.round((val/anterior)*100) : null;
          return `
          <div class="funnel-item">
            <div class="name">${esc(label)}</div>
            <div class="funnel-bar-bg"><div class="funnel-bar" style="width:${Math.round((val/max)*100)}%;"></div></div>

          </div>`;
        }).join('')}

      <h3 style="font-size:15px;margin:20px 0 8px 0;">Finalistas / contratados (${contratados.length})</h3>

      <div class="table-wrap"><table><thead><tr><th>Nome</th><th>Contato</th><th>Data da proposta</th></tr></thead><tbody>
        ${contratados.map(c=>{ const p=c.etapas.find(e=>e.chave==='proposta'); return '<tr><td>'+esc(c.nome)+'</td><td>'+esc(c.telefone||'')+' '+esc(c.email||'')+'</td><td>'+formatDate(p?p.data:'')+'</td></tr>'; }).join('')}
      </tbody></table></div>`}

      <h3 style="font-size:15px;margin:20px 0 8px 0;">Candidatos que declinaram do processo (${declinaram.length})</h3>
      ${declinaram.length===0 ? '<p class="hint">Nenhum declínio registrado.</p>' : `
      <div class="table-wrap"><table><thead><tr><th>Nome</th><th>Data</th><th>Motivo informado</th></tr></thead><tbody>
        ${declinaram.map(c=>'<tr><td>'+esc(c.nome)+'</td><td>'+formatDate(c.dataDeclinio)+'</td><td>'+esc(c.motivoDeclinio||'—')+'</td></tr>').join('')}
      </tbody></table></div>`}

      <h3 style="font-size:15px;margin:20px 0 8px 0;">Candidatos não aprovados no processo (${naoAvancaram.length})</h3>
      ${naoAvancaram.length===0 ? '<p class="hint">Nenhum candidato reprovado até o momento.</p>' : `
      <div class="table-wrap"><table><thead><tr><th>Nome</th><th>Etapa em que foi eliminado</th></tr></thead><tbody>
        ${naoAvancaram.map(c=>{ const e = c.etapas.slice().reverse().find(x=>x.resultado==='nao_avancou'); return '<tr><td>'+esc(c.nome)+'</td><td>'+esc(e?e.nome:'—')+'</td></tr>'; }).join('')}
      </tbody></table></div>`}
    </div>
  `;
}

/* ============================= PÁGINA PÚBLICA DE INSCRIÇÃO ============================= */
function getHashCargoId(){
  const h = window.location.hash || '';
  const m = h.match(/^#inscricao-(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}

function getHashAvaliacaoId(){
  const h = window.location.hash || '';
  const m = h.match(/^#avaliacao-(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}

function getHashCulturaId(){
  const h = window.location.hash || '';

}

function calcularResultadoCultura(clienteId){
  const respostas = db.diagnosticosCultura.filter(d=>d.clienteId===clienteId);
  const tipos = ['cla','adhocracia','mercado','hierarquia'];
  const somasAtual = {cla:0, adhocracia:0, mercado:0, hierarquia:0};
  const somasDesejado = {cla:0, adhocracia:0, mercado:0, hierarquia:0};

  respostas.forEach(r=>{
    DIMENSOES_CULTURA.forEach(dim=>{
      const resp = r.respostas[dim.chave];
      if(!resp) return;
      tipos.forEach(tipo=>{
        const valor = resp[tipo];
        if(valor===undefined || valor===null) return;
        // Compatível com respostas antigas (só "atual", valor numérico direto) e novas ({atual, desejado}).
        if(typeof valor === 'object'){
          if(valor.atual!==undefined) somasAtual[tipo] += parseFloat(valor.atual)||0;
          if(valor.desejado!==undefined) somasDesejado[tipo] += parseFloat(valor.desejado)||0;
        } else {
          somasAtual[tipo] += parseFloat(valor)||0;
        }
      });
    });
  });

  const itensPorTipo = respostas.length * DIMENSOES_CULTURA.length;
  const mediaAtual = {}, mediaDesejado = {}, gap = {};
  tipos.forEach(tipo=>{
    mediaAtual[tipo] = itensPorTipo>0 ? Math.round((somasAtual[tipo]/itensPorTipo)*10)/10 : 0;
    mediaDesejado[tipo] = itensPorTipo>0 ? Math.round((somasDesejado[tipo]/itensPorTipo)*10)/10 : 0;
    gap[tipo] = Math.round((mediaDesejado[tipo]-mediaAtual[tipo])*10)/10;
  });

  let dominanteAtual = 'cla', dominanteDesejado = 'cla';
  tipos.forEach(t=>{
    if(mediaAtual[t]>mediaAtual[dominanteAtual]) dominanteAtual = t;
    if(mediaDesejado[t]>mediaDesejado[dominanteDesejado]) dominanteDesejado = t;
  });

  return {
    totalRespostas: respostas.length,
    mediaPorTipo: mediaAtual, // mantém compatibilidade com quem já usa esse nome
    mediaAtual, mediaDesejado, gap,
    dominante: respostas.length>0 ? dominanteAtual : null,
    dominanteDesejado: respostas.length>0 ? dominanteDesejado : null
  };
}

function avancarProximaEtapa(candidatoId){
  const c = db.candidatos.find(x=>x.id===candidatoId);
  if(!c) return;
  const idx = c.etapas.findIndex(e=>e.resultado==='');
  if(idx===-1){ showToast('Este candidato já passou por todas as etapas.', true); return; }
  const statusAntes = statusCandidato(c);
  c.etapas[idx].resultado = 'avancou';
  if(!c.etapas[idx].data) c.etapas[idx].data = todayISO();
  const statusDepois = statusCandidato(c);
  saveDB(); renderView();
  showToast('Avançou: '+c.etapas[idx].nome+' — '+c.nome+'.');
  if(statusAntes !== statusDepois && (statusDepois==='contratado' || statusDepois==='nao_avancou')){
    modalMensagemAutomatica(c, statusDepois);
  }
}

function extensoReais(valor){
  valor = Math.round((parseFloat(valor)||0) * 100) / 100;
  const inteiro = Math.floor(valor);
  const centavos = Math.round((valor - inteiro) * 100);
  const unidades = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove'];
  const dezA19 = ['dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const dezenas = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const centenas = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];

  function tresDigitos(n){
    if(n === 0) return '';
    if(n === 100) return 'cem';
    const c = Math.floor(n/100), r = n%100;
    const partes = [];
    if(c>0) partes.push(centenas[c]);
    if(r>0){
      if(r<10) partes.push(unidades[r]);
      else if(r<20) partes.push(dezA19[r-10]);
      else {
        const d = Math.floor(r/10), u = r%10;
        partes.push(dezenas[d] + (u>0 ? ' e '+unidades[u] : ''));
      }
    }
    return partes.join(' e ');
  }
  function grupoMilhar(n){
    if(n === 0) return 'zero';
    const milhar = Math.floor(n/1000), resto = n%1000;
    const partes = [];
    if(milhar>0) partes.push(milhar===1 ? 'mil' : tresDigitos(milhar)+' mil');
    if(resto>0) partes.push(tresDigitos(resto));
    return partes.join(milhar>0 && resto>0 ? ' e ' : '');
  }

  const textoInteiro = grupoMilhar(inteiro);
  const sufixoReal = inteiro === 1 ? 'real' : 'reais';
  let resultado = textoInteiro + ' ' + sufixoReal;
  if(centavos>0){
    const textoCentavos = centavos<10 ? unidades[centavos] : tresDigitos(centavos);
    resultado += ' e ' + textoCentavos + (centavos===1 ? ' centavo' : ' centavos');
  }
  return resultado;
}

function dataPorExtenso(dataISO){
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const [y,m,d] = dataISO.split('-').map(Number);
  return d + ' de ' + meses[m-1] + ' de ' + y;
}

function montarTextoCartaProposta(candidato, cargo, cliente, dadosProposta){
  const valorNum = parseFloat(dadosProposta.salario) || 0;
  const valorFormatado = valorNum ? valorNum.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) : '';
  const generoSaudacao = 'Prezado(a)';

  let texto = (dadosProposta.cidade || 'Feira de Santana/BA').split('/')[0] + ', ' + dataPorExtenso(todayISO()) + '.\n\n';
  texto += 'CARTA PROPOSTA\n\n';
  texto += generoSaudacao + ' ' + candidato.nome.toUpperCase() + ',\n\n';
  texto += 'É com grande satisfação que estamos formalizando a proposta de trabalho na ' + (cliente?cliente.nome:'nossa empresa') + ', em ' + (dadosProposta.cidade || 'Feira de Santana/BA') + ', para o cargo de ' + (cargo?cargo.titulo:'—') + (valorNum ? ' com salário base mensal de R$ ' + valorFormatado + ' (' + extensoReais(valorNum) + ')' : '') + '.\n\n';
  texto += 'As condições abaixo listadas são parte integrante da proposta:\n\n';

  const beneficiosAtivos = cliente && cliente.beneficios ? BENEFICIOS_PADRAO.filter(b=>cliente.beneficios[b.chave] && cliente.beneficios[b.chave].ativo) : [];
  beneficiosAtivos.forEach(b=>{
    texto += '- ' + b.nome.toUpperCase() + ': ' + (cliente.beneficios[b.chave].valor || '(condição a combinar)') + '\n';
  });
  if(beneficiosAtivos.length) texto += '\n';

  if(dadosProposta.observacoes) texto += dadosProposta.observacoes + '\n\n';

  texto += 'Informamos que a data prevista para efetivação da sua contratação é ' + formatDate(dadosProposta.dataAdmissao) + '. A sua assinatura no espaço abaixo evidenciará a aceitação dessa proposta de trabalho, que ao final do processo seletivo será devidamente formalizada por meio de contrato específico, de acordo com a legislação trabalhista.\n\n\n';
  texto += '__________________________________\n' + candidato.nome.toUpperCase();
  return texto;
}

async function renderAvaliacaoComportamental(candidatoId){

  if(!appsScriptConfigurado()){
    root.innerHTML = paginaPublicaIndisponivel('A integração desta página ainda não foi concluída por quem administra o painel.');
    return;
  }

  let info;
  try{
    info = await chamarAppsScriptGet('action=candidatoInfo&id=' + encodeURIComponent(candidatoId));
  }catch(err){
    root.innerHTML = `<div class="card" style="max-width:520px;margin:60px auto;padding:36px;text-align:center;">
      <h2 style="margin-bottom:10px;">Não foi possível carregar</h2>
      <p class="hint" style="margin-bottom:16px;">${esc(err.message || 'Ocorreu um erro ao carregar a avaliação.')}</p>
      <span class="btn btn-primary" id="btn-tentar-novamente-avaliacao">Tentar novamente</span>
    </div>`;
    const btn = document.getElementById('btn-tentar-novamente-avaliacao');
    if(btn) btn.addEventListener('click', ()=> renderAvaliacaoComportamental(candidatoId));
    return;
  }

  if(!info || !info.nome){
    root.innerHTML = paginaPublicaIndisponivel('Candidato não encontrado. Confira o link recebido.');
    return;
  }

  if(info.jaRespondeu){
    root.innerHTML = `<div class="card" style="max-width:520px;margin:60px auto;padding:36px;text-align:center;">
      <h2 style="margin-bottom:10px;">Avaliação já respondida</h2>
      <p class="hint">Olá ${esc(info.nome.split(' ')[0])}, identificamos que você já respondeu esta avaliação anteriormente. Se precisar refazer, entre em contato com quem te enviou o link.</p>
    </div>`;
    return;
  }

  const primeiroNome = info.nome.split(' ')[0];

  root.innerHTML = `
    <div class="card" style="max-width:680px;margin:32px auto;padding:0;overflow:hidden;">
      <div style="background:var(--spine);padding:26px 32px;text-align:center;">
        <img src="data:image/png;base64,${LOGO_CLARO_B64}" alt="Caroline Peixoto DHO" style="max-width:260px;width:100%;height:auto;display:inline-block;">
      </div>
      <div style="padding:32px;">
        <h1 style="font-size:22px;margin-bottom:6px;">Avaliação Comportamental</h1>
        <p style="color:var(--ink-soft);font-size:14px;margin:0 0 20px 0;">Olá ${esc(primeiroNome)}! Em cada grupo abaixo, há 4 palavras. Dê uma nota de <strong>1 a 4 para cada uma, sem repetir</strong>: <strong>4</strong> para a que MAIS combina com você e <strong>1</strong> para a que MENOS combina. Não existe resposta certa ou errada — responda de forma espontânea. Leva cerca de 8 a 10 minutos.</p>

        <form id="form-avaliacao">
          ${BLOCOS_AVALIACAO_COMPORTAMENTAL.map((bloco, i)=>{
            const letras = ['D','I','S','C'];
            const ordem = [...letras].sort(()=>Math.random()-0.5);
            return `
            <div style="border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:10px;">
              <div class="hint" style="margin-bottom:8px;">Grupo ${i+1} de ${BLOCOS_AVALIACAO_COMPORTAMENTAL.length} — ${esc(bloco.titulo)}</div>
              <div style="display:grid;grid-template-columns:1fr 96px;gap:8px 10px;align-items:center;">
                ${ordem.map(letra=>`
                  <div style="font-size:13.5px;">${esc(bloco[letra])}</div>
                  <select class="disc-rank" data-bloco="${i}" data-letra="${letra}" required>
                    <option value="">Nota…</option>
                    <option value="4">4 · Mais</option>
                    <option value="3">3</option>
                    <option value="2">2</option>
                    <option value="1">1 · Menos</option>
                  </select>
                `).join('')}
              </div>
            </div>`;
          }).join('')}
          <p class="hint" id="erro-avaliacao" style="color:var(--red);display:none;"></p>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;" id="btn-enviar-avaliacao">Enviar avaliação</button>
        </form>
      </div>
    </div>
    <p style="text-align:center;color:var(--ink-soft);font-size:12px;margin-top:16px;">Caroline Peixoto DHO · Desenvolvimento Humano e Organizacional</p>
  `;

  document.getElementById('form-avaliacao').addEventListener('submit', async e=>{
    e.preventDefault();
    const erroEl = document.getElementById('erro-avaliacao');
    erroEl.style.display = 'none';
    const scores = {D:0, I:0, S:0, C:0};
    for(let i=0; i<BLOCOS_AVALIACAO_COMPORTAMENTAL.length; i++){
      const selects = document.querySelectorAll('.disc-rank[data-bloco="'+i+'"]');
      const valores = [];
      selects.forEach(s=> valores.push(s.value));
      if(valores.some(v=>!v)){

        erroEl.style.display = 'block';
        selects[0].closest('div[style*="border:1px solid"]')?.scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      const unicos = new Set(valores);
      if(unicos.size !== 4){
        erroEl.textContent = 'No grupo '+(i+1)+', cada nota de 1 a 4 só pode ser usada uma vez — não repita valores.';
        erroEl.style.display = 'block';
        return;
      }
      selects.forEach(s=>{ scores[s.dataset.letra] += parseInt(s.value, 10); });
    }
    let perfilLetra = 'D';
    ['I','S','C'].forEach(l=>{ if(scores[l] > scores[perfilLetra]) perfilLetra = l; });

    const btn = document.getElementById('btn-enviar-avaliacao');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try{
      await chamarAppsScriptPost('salvarAvaliacao', {candidatoId: candidatoId, perfil: perfilLetra, scores: scores});
      root.innerHTML = `<div class="card" style="max-width:520px;margin:60px auto;padding:36px;text-align:center;">

      </div>`;
    }catch(err){
      erroEl.textContent = err.message || 'Não foi possível enviar agora. Verifique sua conexão e tente novamente.';
      erroEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Enviar avaliação';
    }
  });
}

function abrirProntuario(colaboradorId){
  const c = getColaborador(colaboradorId);
  if(!c) return;
  const cliente = getCliente(c.clienteId);
  const funcao = getFuncao(c.funcaoId);
  const descritivo = funcao ? db.descritivosCargo.find(d=>d.funcaoId===funcao.id) : null;
  const dataFimContagem = c.dataDesligamento || todayISO();
  const diasCasa = daysBetween(c.dataAdmissao, dataFimContagem) || 0;
  const anosCasa = Math.floor(diasCasa/365);
  const mesesCasa = Math.floor((diasCasa%365)/30);
  const tempoCasaTexto = (anosCasa>0? anosCasa+' ano(s) ':'') + mesesCasa+' mês(es)';

  const historicoOrdenado = (c.historicoSalarial||[]).slice().sort((a,b)=>b.data.localeCompare(a.data));
  const registros = (c.registros||[]).slice().sort((a,b)=>b.data.localeCompare(a.data));

  openModal(`
    <button class="modal-close" data-action="fechar-modal">&times;</button>
    <h2>📋 Prontuário — ${esc(c.nome)}</h2>
    <div class="modal-sub">${esc(cliente?.nome||'')}${funcao?' · '+esc(funcao.nome):''}</div>

    <div class="kpi-grid" style="margin:14px 0;">
      <div class="kpi"><div class="label">Status</div><div style="margin-top:4px;">${statusColaboradorBadge(c)}</div></div>
      <div class="kpi"><div class="label">Admissão</div><div class="value" style="font-size:16px;">${formatDate(c.dataAdmissao)}</div></div>
      <div class="kpi"><div class="label">Tempo de casa</div><div class="value" style="font-size:16px;">${tempoCasaTexto}</div></div>
      <div class="kpi"><div class="label">Salário atual</div><div class="value" style="font-size:16px;">${statusColaborador(c)!=='desligado' ? formatMoeda(salarioAtualColaborador(c)) : '—'}</div></div>
    </div>

    <div class="section-title">Contato</div>
    <p class="hint">${c.telefone?esc(c.telefone):'Telefone não informado'}${c.email?' · '+esc(c.email):''}</p>

    ${funcao ? `
    <div class="section-title">Cargo</div>
    <p class="hint">${esc(funcao.nome)}${funcao.subordinadoA?' · Subordinado a '+esc(funcao.subordinadoA):''}${funcao.area?' · '+esc(funcao.area):''}<br>
    ${descritivo ? '📄 Descritivo de cargo preenchido — <span class="btn btn-ghost btn-sm" data-action="descritivo-cargo" data-id="'+funcao.id+'">Ver descritivo</span>' : 'Nenhum descritivo de cargo cadastrado para esta função.'}</p>
    ` : '<div class="section-title">Cargo</div><p class="hint">Nenhuma função vinculada.</p>'}

    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Período de experiência</span>
      <span class="btn btn-secondary btn-sm" data-action="abrir-avaliacao-experiencia" data-id="${c.id}">+ Nova avaliação</span>
    </div>
    ${(() => {
      const prazos = prazosExperiencia(c);
      if(!prazos) return '<p class="hint">Sem data de admissão para calcular os prazos.</p>';
      const avaliacoes = (c.avaliacoesExperiencia||[]).slice().sort((a,b)=>b.dataAvaliacao.localeCompare(a.dataAvaliacao));
      let html = '<p class="hint">1ª etapa ('+prazos.dias1+' dias): vence '+formatDate(prazos.fimEtapa1)+(prazos.avaliadoEtapa1?' — ✅ avaliado':' — pendente')+'<br>2ª etapa ('+(prazos.dias1+prazos.dias2)+' dias): vence '+formatDate(prazos.fimEtapa2)+(prazos.avaliadoEtapa2?' — ✅ avaliado':' — pendente')+'</p>';
      if(avaliacoes.length){
        html += avaliacoes.map(a=>{
          const notas = CRITERIOS_EXPERIENCIA.map(crit=> esc(crit.nome)+': <strong>'+esc((a.criterios[crit.chave]||'—').replace(/^./,ch=>ch.toUpperCase()))+'</strong>').join(' · ');
          const etapaLabel = a.periodo==='etapa1' ? '1ª etapa' : '2ª etapa';
          return '<div class="card" style="padding:10px 14px;margin-bottom:8px;"><strong>Avaliação — '+etapaLabel+'</strong> <span class="hint">'+formatDate(a.dataAvaliacao)+(a.avaliador?' · '+esc(a.avaliador):'')+'</span><p class="hint" style="margin:6px 0 0 0;">'+notas+'</p></div>';
        }).join('');
      }
      return html;
    })()}

    ${c.emAfastamento ? `
    <div class="section-title">Afastamento atual</div>
    <p class="hint">${esc(c.tipoAfastamento||'Tipo não informado')} — desde ${formatDate(c.dataInicioAfastamento)}${c.dataFimAfastamento?' · previsão de retorno '+formatDate(c.dataFimAfastamento):''}</p>
    ` : ''}

    ${c.dataDesligamento ? `
    <div class="section-title">Desligamento</div>
    <p class="hint">${formatDate(c.dataDesligamento)} — ${esc(c.tipoDesligamento||'Tipo não informado')}${c.motivoDesligamento?'<br>'+esc(c.motivoDesligamento):''}</p>
    ` : ''}

    <div class="section-title">Histórico salarial</div>
    <div class="table-wrap"><table><thead><tr><th>Data</th><th>Valor</th><th>Motivo</th></tr></thead><tbody>
      ${historicoOrdenado.map(h=>'<tr><td>'+formatDate(h.data)+'</td><td>'+formatMoeda(parseFloat(h.valor)||0)+'</td><td>'+esc(h.motivo||'—')+'</td></tr>').join('')}
      <tr><td>${formatDate(c.dataAdmissao)}</td><td>${formatMoeda(parseFloat(c.salarioAdmissao)||0)}</td><td>Salário de admissão</td></tr>
    </tbody></table></div>

    ${c.observacoes ? `<div class="section-title">Observações gerais</div><p class="hint">${esc(c.observacoes)}</p>` : ''}

    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Registros (feedbacks, 1:1, advertências, suspensões)</span>
      <span class="btn btn-secondary btn-sm" data-action="novo-registro-colaborador" data-id="${c.id}">+ Novo registro</span>
    </div>
    ${registros.length===0 ? '<p class="hint">Nenhum registro ainda.</p>' : registros.map(r=>`
      <div class="card" style="padding:10px 14px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;gap:10px;">
          <strong>${esc(r.tipo)}</strong>
          <span class="hint" style="white-space:nowrap;">${formatDate(r.data)}</span>
        </div>
        <p style="margin:6px 0 0 0;font-size:13.5px;white-space:pre-line;">${esc(r.descricao)}</p>
        ${r.registradoPor?'<p class="hint" style="margin:6px 0 0 0;">Registrado por: '+esc(r.registradoPor)+'</p>':''}
      </div>
    `).join('')}

    <div class="modal-footer">
      <span></span>
      <div class="right">
        <span class="btn btn-secondary" data-action="fechar-modal">Fechar</span>
        <span class="btn btn-primary" data-action="editar-colaborador" data-id="${c.id}">Editar dados cadastrais</span>
      </div>
    </div>
  `);
}

      .map(linha => ({ data: linha.querySelector('.input-sal-data').value, valor: linha.querySelector('.input-sal-valor').value, motivo: linha.querySelector('.input-sal-motivo').value }))
      .filter(h => h.data && h.valor);

      clienteId: colaborador.clienteId,
      nome: f.get('nome').trim(),
      funcaoId: f.get('funcaoId') || '',

      email: f.get('email').trim(),
      salarioAdmissao: f.get('salarioAdmissao') || '',
      historicoSalarial: historicoSalarial,
      registros: colaborador.registros || [],
      avaliacoesExperiencia: colaborador.avaliacoesExperiencia || [],
      duracaoExperiencia1: f.get('duracaoExperiencia1') || 45,
      duracaoExperiencia2: f.get('duracaoExperiencia2') || 0,
      dataAdmissao: f.get('dataAdmissao'),
      emAfastamento: !!f.get('emAfastamento'),
      tipoAfastamento: f.get('tipoAfastamento') || '',
      dataInicioAfastamento: f.get('dataInicioAfastamento') || '',
      dataFimAfastamento: f.get('dataFimAfastamento') || '',
      dataDesligamento: f.get('dataDesligamento') || '',
      tipoDesligamento: f.get('tipoDesligamento') || '',
      motivoDesligamento: f.get('motivoDesligamento').trim(),
      observacoes: f.get('observacoes').trim()
    };
    if(editando){ Object.assign(colaborador, dados); }
    else { db.colaboradores.push(Object.assign({id:uid('colab')}, dados)); }
    closeModal(); saveDB(); renderView();
  });
}

function linhaHabilidade(item, datalistId){
  return `<div class="form-grid" data-linha-habilidade style="grid-template-columns:1fr 160px 36px;margin-bottom:6px;">
    <input placeholder="Nome da habilidade" value="${esc(item&&item.nome||'')}" class="input-hab-nome" list="${datalistId||''}" autocomplete="off">
    <select class="input-hab-nivel">
      <option value="1" ${(!item||item.nivel==='1')?'selected':''}>1 · Obrigatório</option>
      <option value="2" ${item&&item.nivel==='2'?'selected':''}>2 · Desejável</option>
      <option value="3" ${item&&item.nivel==='3'?'selected':''}>3 · Desenvolvimento</option>
    </select>
    <button type="button" class="btn btn-danger btn-sm" data-remover-linha style="padding:6px;">✕</button>
  </div>`;
}

function habilidadesJaUsadas(campo){
  const nomes = new Set();
  db.descritivosCargo.forEach(d=>{
    (d[campo]||[]).forEach(h=>{ if(h && h.nome) nomes.add(h.nome); });
  });
  return Array.from(nomes).sort((a,b)=>a.localeCompare(b));
}

function modalDescritivoCargo(funcao){
  const existente = db.descritivosCargo.find(d=>d.funcaoId===funcao.id);
  const d = existente || {
    id:'', funcaoId:funcao.id, versao:'00', data:todayISO(), sumario:'', atividadesPrincipais:'',
    grauInstrucao:'Superior Completo', formacaoRequerida:'', experienciaComFormacao:'', experienciaSemFormacao:'',
    habilidadesComportamentais:[], habilidadesTecnicas:[], observacao:'', aprovadoPor:'', dataAprovacao:''
  };

  const sugestoesComp = habilidadesJaUsadas('habilidadesComportamentais');
  const sugestoesTec = habilidadesJaUsadas('habilidadesTecnicas');

  openModal(`

      <div class="section-title">2. Sumário do Cargo</div>
      <p class="hint" style="margin-top:-4px;">Descreva em poucas linhas para que o cargo existe: o que faz, como, e para que faz.</p>
      <div class="field full"><textarea name="sumario" style="min-height:70px;">${esc(d.sumario)}</textarea></div>

      <div class="section-title">3. Atividades principais</div>
      <p class="hint" style="margin-top:-4px;">Principais atividades desempenhadas pelo ocupante do cargo (uma por linha).</p>
      <div class="field full"><textarea name="atividadesPrincipais" style="min-height:90px;">${esc(d.atividadesPrincipais)}</textarea></div>

      <div class="section-title">4.1 Escolaridade e Experiência</div>
      <div class="form-grid">
        <div class="field">
          <label>Grau de instrução (completo)</label>
          <select name="grauInstrucao">
            ${['Ens. Fundamental (1º Grau)','Ens. Médio (2º Grau)','Curso Técnico','Superior Incompleto','Superior Completo','Pós-graduação'].map(o=>'<option '+(d.grauInstrucao===o?'selected':'')+'>'+o+'</option>').join('')}
          </select>
        </div>
        <div class="field"><label>Formação requerida</label><input name="formacaoRequerida" value="${esc(d.formacaoRequerida)}" placeholder="Ex.: Administração, Gestão de RH…"></div>
        <div class="field"><label>Experiência mínima — com formação requerida</label><input name="experienciaComFormacao" value="${esc(d.experienciaComFormacao)}" placeholder="Ex.: 1 ano"></div>
        <div class="field"><label>Experiência mínima — sem formação requerida</label><input name="experienciaSemFormacao" value="${esc(d.experienciaSemFormacao)}" placeholder="Ex.: 3 anos"></div>
      </div>

      <div class="section-title">4.2 Habilidades Comportamentais</div>
      <p class="hint" style="margin-top:-4px;">Características comportamentais necessárias. Nível: 1 = Obrigatório · 2 = Desejável · 3 = Desenvolvimento. Comece a digitar para reaproveitar competências já usadas em outros cargos.</p>
      <div id="lista-hab-comportamentais">${(d.habilidadesComportamentais.length?d.habilidadesComportamentais:[null]).map(h=>linhaHabilidade(h,'sugestoes-hab-comp')).join('')}</div>

      <datalist id="sugestoes-hab-comp">${sugestoesComp.map(n=>'<option value="'+esc(n)+'">').join('')}</datalist>

      <p class="hint" style="margin-top:-4px;">Conhecimentos técnicos requeridos. Mesmos níveis acima. Comece a digitar para reaproveitar competências já usadas em outros cargos.</p>
      <div id="lista-hab-tecnicas">${(d.habilidadesTecnicas.length?d.habilidadesTecnicas:[null]).map(h=>linhaHabilidade(h,'sugestoes-hab-tec')).join('')}</div>
      <span class="btn btn-secondary btn-sm" id="btn-add-hab-tec" type="button">+ Adicionar habilidade técnica</span>
      <datalist id="sugestoes-hab-tec">${sugestoesTec.map(n=>'<option value="'+esc(n)+'">').join('')}</datalist>

      <div class="section-title">5. Observação</div>
      <div class="field full"><textarea name="observacao">${esc(d.observacao)}</textarea></div>

      <div class="section-title">6. Aprovação</div>
      <div class="form-grid">
        <div class="field"><label>Superior imediato</label><input name="aprovadoPor" value="${esc(d.aprovadoPor)}"></div>
        <div class="field"><label>Data</label><input type="date" name="dataAprovacao" value="${d.dataAprovacao||''}"></div>
      </div>

      <div class="modal-footer">
        <span></span>
        <div class="right">
          <span class="btn btn-secondary" data-action="fechar-modal">Cancelar</span>

  `);

  document.getElementById('btn-add-hab-comp').addEventListener('click', ()=>{
    document.getElementById('lista-hab-comportamentais').insertAdjacentHTML('beforeend', linhaHabilidade(null, 'sugestoes-hab-comp'));
  });
  document.getElementById('btn-add-hab-tec').addEventListener('click', ()=>{
    document.getElementById('lista-hab-tecnicas').insertAdjacentHTML('beforeend', linhaHabilidade(null, 'sugestoes-hab-tec'));
  });
  form.addEventListener('click', e=>{
    if(e.target.matches('[data-remover-linha]')){
      const linha = e.target.closest('[data-linha-habilidade]');
      if(linha.parentElement.children.length > 1) linha.remove();
      else { linha.querySelector('.input-hab-nome').value=''; }
    }
  });

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const lerHabilidades = (containerId) => Array.from(document.querySelectorAll('#'+containerId+' [data-linha-habilidade]'))
      .map(linha => ({ nome: linha.querySelector('.input-hab-nome').value.trim(), nivel: linha.querySelector('.input-hab-nivel').value }))
      .filter(h => h.nome);

    const dados = {
      funcaoId: funcao.id,
      versao: d.versao,
      data: existente ? d.data : todayISO(),
      sumario: f.get('sumario').trim(),
      atividadesPrincipais: f.get('atividadesPrincipais').trim(),
      grauInstrucao: f.get('grauInstrucao'),
      formacaoRequerida: f.get('formacaoRequerida').trim(),
      experienciaComFormacao: f.get('experienciaComFormacao').trim(),
      experienciaSemFormacao: f.get('experienciaSemFormacao').trim(),
      habilidadesComportamentais: lerHabilidades('lista-hab-comportamentais'),
      habilidadesTecnicas: lerHabilidades('lista-hab-tecnicas'),
      observacao: f.get('observacao').trim(),
      aprovadoPor: f.get('aprovadoPor').trim(),
      dataAprovacao: f.get('dataAprovacao') || ''
    };

    if(existente){ Object.assign(existente, dados); }
    else { db.descritivosCargo.push(Object.assign({id:uid('desc')}, dados)); }
    closeModal(); saveDB(); renderView();
    showToast('Descritivo de cargo salvo.');
  });
}

  document.querySelectorAll('.chk-beneficio').forEach(chk=>{

    });
  });
  document.getElementById('input-logo-cliente').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file && file.size > TAMANHO_MAX_LOGO){
      showToast('Imagem muito grande (máximo de 10MB).', true);
      e.target.value = ''; arquivoLogoSelecionado = null; return;
    }
    arquivoLogoSelecionado = file || null;
    if(file){
      lerArquivoBase64(file).then(dataUrl=>{
        const img = document.getElementById('logo-preview-img');
        if(img){ img.src = dataUrl; document.getElementById('logo-preview-area').style.display='block'; }
      });
    }
  });

    const f = new FormData(e.target);

    BENEFICIOS_PADRAO.forEach(b=>{
      const chk = document.querySelector('.chk-beneficio[data-beneficio="'+b.chave+'"]');
      const valorInput = document.querySelector('[data-beneficio-valor="'+b.chave+'"]');
      beneficios[b.chave] = { ativo: !!(chk&&chk.checked), valor: valorInput?valorInput.value.trim():'' };
    });
    const dados = {nome:f.get('nome').trim(), nomeContato:f.get('nomeContato').trim(), telefoneContato:f.get('telefoneContato').trim(), emailContato:f.get('emailContato').trim(), observacoes:f.get('observacoes').trim(), tipoServico:f.get('tipoServico')||'rs', valorMensalidadeBPO:f.get('valorMensalidadeBPO')||'', beneficios: beneficios, temLogo: cliente.temLogo||false, logoNome: cliente.logoNome||'', logoUrlPublica: cliente.logoUrlPublica||''};

    const submitBtn = e.target.querySelector('button[type="submit"]');
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Salvando…'; }
    try{
      if(arquivoLogoSelecionado){
        const salvo = await salvarLogoCliente(clienteId, arquivoLogoSelecionado);
        dados.temLogo = true; dados.logoNome = salvo.filename; dados.logoUrlPublica = salvo.url || '';
      } else if(!!f.get('removerLogo')){
        await removerLogoClienteStorage(clienteId);
        dados.temLogo = false; dados.logoNome = ''; dados.logoUrlPublica = '';
      }
    }catch(err){
      showToast(err.message || 'Erro ao processar a logo.', true);
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Salvar cliente'; }
      return;
    }

    if(editando){ Object.assign(cliente, dados); }
    else { db.clientes.push(Object.assign({id:clienteId}, dados)); }
    state.viewClienteId = clienteId;
    closeModal(); saveDB(); renderView();
  });
}

async function sincronizarVagaPublica(cargo){
  if(!appsScriptConfigurado()) return;
  const cliente = getCliente(cargo.clienteId);
  const payload = {
    cargoId: cargo.id,
    ativa: !!cargo.vagaPublicaAtiva && cargo.status !== 'fechada',
    status: cargo.status,
    titulo: cargo.titulo,
    clienteNome: cargo.exibirNomeCliente ? (cliente ? cliente.nome : '') : 'Cliente confidencial',
    clienteLogoUrl: (cargo.exibirNomeCliente && cliente) ? (cliente.logoUrlPublica || '') : '',
    modalidade: cargo.modalidade || '',
    local: cargo.localTrabalho || '',
    salario: cargo.salario || '',
    descricao: cargo.descricaoPublica || '',
    oQueVaiFazer: cargo.oQueVaiFazer || '',
    oQueBuscamos: cargo.oQueBuscamos || '',
    beneficios: cargo.beneficios || {},
    beneficiosOutros: cargo.beneficiosOutros || ''
